<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a110c">
<title>STINGER – Interceptor Challenge</title>
<style>
:root{
 --panel:rgba(10,17,12,.93); --line:#34503a; --line2:#56784f; --olive:#4b5d36;
 --amber:#ffb000; --red:#ff4a3d; --green:#7dff9a; --white:#e9efe6; --grey:#8d988e;
 --sans:"Bahnschrift","DIN Condensed","Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
 --mono:"Consolas","SF Mono","Menlo","Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--white);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
body.playing #cv{cursor:none}
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.active{display:flex}
.screen.dim{background:rgba(0,0,0,.5)}
.panel{position:relative;width:min(660px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);padding:22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.65);touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel h2{font-size:clamp(21px,3.2vw,28px);letter-spacing:.1em;color:var(--amber);margin-bottom:12px;font-weight:700}
.panel p,.panel li{line-height:1.55;color:#cfd8cc;font-size:15px}
.panel ul{padding-left:20px;margin:6px 0 12px}
.panel h3{font-size:16px;color:var(--white);letter-spacing:.06em;margin:16px 0 6px}
.btn{display:block;width:100%;font-family:var(--sans);font-size:clamp(15px,2vw,17px);letter-spacing:.12em;font-weight:700;color:var(--white);background:rgba(22,34,24,.86);border:1px solid var(--line2);border-left:4px solid var(--line2);padding:11px 16px;margin:7px 0;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.btn:hover,.btn:focus-visible{background:rgba(255,176,0,.16);border-color:var(--amber);outline:none}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--amber);color:#1a1200;background:#f2a900}
.btn.primary:hover,.btn.primary:focus-visible{background:#ffc23d}
.btn .k{float:right;font-family:var(--mono);opacity:.6;font-size:12px;margin-top:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:150px}
#scr-menu{justify-content:flex-start;padding-left:max(5vw,env(safe-area-inset-left))}
.menu-wrap{width:min(440px,100%);max-height:100%;overflow-y:auto;overflow-x:visible;touch-action:pan-y;padding-right:4px}
.title{font-weight:800;font-size:clamp(46px,7.4vw,84px);letter-spacing:.06em;white-space:nowrap;line-height:.88;color:var(--white);text-shadow:0 3px 0 #000}
.title2{font-family:var(--mono);font-size:clamp(13px,1.8vw,16px);letter-spacing:.38em;color:var(--amber);margin:10px 0 4px}
.subtitle{font-size:15px;color:#b9c4b5;margin-bottom:18px}
.seg{display:flex;border:1px solid var(--line2);margin:4px 0 10px}
.seg button{flex:1;padding:9px 4px;background:rgba(0,0,0,.35);border:0;border-right:1px solid var(--line);color:#c4cdc1;font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--amber);color:#140e00}
.seg-l{font-size:13px;color:var(--grey);margin-top:6px}
.menu-foot{font-size:14px;color:var(--grey);margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.menu-foot b{color:var(--amber);font-weight:700}
table.stats{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 14px}
table.stats td{padding:7px 4px;border-bottom:1px dashed #2c4030}
table.stats td:last-child{text-align:right;color:var(--amber);font-family:var(--mono)}
pre.report{font-family:var(--mono);font-size:clamp(11.5px,1.7vw,14px);line-height:1.5;color:#dfe8da;background:rgba(0,0,0,.4);border:1px solid #2b3e2e;padding:12px;overflow-x:auto;white-space:pre;margin:8px 0 12px}
.set{display:grid;grid-template-columns:1fr 1.3fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #2c4030}
.set label{font-size:15px}
input[type=range]{width:100%;accent-color:var(--amber)}
select{width:100%;background:#101a12;color:var(--white);border:1px solid var(--line2);padding:7px;font-family:var(--sans);font-size:14px}
.toggle{justify-self:start;width:54px;height:28px;border:1px solid var(--line2);background:#101a12;position:relative;cursor:pointer}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;background:var(--grey);transition:left .15s}
.toggle.on{border-color:var(--amber)} .toggle.on::after{left:30px;background:var(--amber)}
.ribbons{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:10px 0 16px}
.rib{text-align:center;font-size:12.5px;letter-spacing:.04em;color:#dfe6dc}
.rib svg{width:100%;max-width:140px;height:auto;display:block;margin:0 auto 6px}
.rib.off{opacity:.42;filter:grayscale(1)}
.rib small{display:block;color:var(--grey);margin-top:2px;font-size:11.5px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ach div{border:1px solid #2c4030;padding:8px 10px;font-size:13px;background:rgba(0,0,0,.25)}
.ach div b{display:block;color:var(--amber);font-size:13.5px}
.ach div span{color:#aab4a8;font-size:12.5px}
.ach div.off{opacity:.42} .ach div.off b{color:var(--grey)}
.rankbox{display:flex;align-items:center;gap:16px;padding:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);margin:8px 0}
.rankbox svg{width:64px;height:64px;flex:none}
.rankbox b{font-size:20px;color:var(--amber);letter-spacing:.08em}
#toasts{position:fixed;top:max(70px,env(safe-area-inset-top));right:12px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(10,18,12,.96);border:1px solid var(--amber);border-left:4px solid var(--amber);padding:9px 14px;font-size:14px;min-width:220px;animation:tin .35s ease-out}
.toast b{color:var(--amber);display:block;font-size:12px;letter-spacing:.12em}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#tutBox{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);z-index:15;width:min(540px,92vw);background:rgba(8,14,10,.86);border:1px solid var(--amber);padding:10px 14px;font-size:15px;pointer-events:none;display:none}
#tutBox.on{display:block}
#tutBox .st{font-family:var(--mono);font-size:12px;color:var(--amber)}
#tutBox .tt{font-weight:700;font-size:17px;margin:2px 0}
#tutBox .tx{color:#d4ddd1;line-height:1.45}
#tutBox .dots{display:flex;gap:4px;margin-top:7px} #tutBox .dots i{flex:1;height:3px;background:#2c4030} #tutBox .dots i.on{background:var(--amber)}
#tutBox.compact{font-size:13.5px;left:12px;transform:none;top:calc(env(safe-area-inset-top) + 190px);width:min(330px,60vw)}
@media (max-width:620px){#tutBox.compact{top:calc(env(safe-area-inset-top) + 200px);left:50%;transform:translateX(-50%);width:92vw}}
@media (max-height:500px){#tutBox.compact{top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%);width:min(420px,50vw);font-size:12.5px}#tutBox.compact .tx{display:none}}
#tutBox.compact .tt{font-size:15px}
#touchUI{position:fixed;inset:0;z-index:12;pointer-events:none;display:none}
body.touch.playing #touchUI{display:block}
#joy{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.25);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:39px;top:39px;width:46px;height:46px;border-radius:50%;background:rgba(255,176,0,.42);border:1px solid var(--amber)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;width:86px;height:86px;border-radius:50%;border:2px solid var(--amber);background:rgba(20,20,10,.5);color:var(--amber);font-family:var(--mono);font-weight:700;font-size:16px}
#btnLock{right:calc(max(16px,env(safe-area-inset-right)) + 100px);bottom:max(22px,env(safe-area-inset-bottom))}
#btnFire{right:max(16px,env(safe-area-inset-right));bottom:max(100px,calc(env(safe-area-inset-bottom) + 84px));border-color:var(--red);color:var(--red)}
.tbtn.on{background:rgba(255,176,0,.38)}
.tsmall{position:absolute;pointer-events:auto;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border:1px solid var(--line2);background:rgba(0,0,0,.5);color:var(--white);font-family:var(--mono);font-weight:700;font-size:15px}
#btnPause{right:max(10px,env(safe-area-inset-right))}
#btnRadarT{right:calc(max(10px,env(safe-area-inset-right)) + 52px)}
#promoArt svg{width:min(240px,60vw);height:auto;display:block;margin:10px auto;animation:pop .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.promo{text-align:center}
.promo h2{font-size:clamp(28px,5vw,42px)}
.note{font-size:13px;color:var(--grey);margin-top:6px}
/* ---- dokunmatik düzen: KİLİT sol altta, ATEŞ yardımcı askerin yanında, joystick sağ altta ---- */
#joy{left:auto;right:max(16px,env(safe-area-inset-right));width:112px;height:112px}
#joyKnob{left:33px;top:33px}
#btnLock{right:auto;left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom))}
#btnFire{right:auto;bottom:auto;left:130px;top:60%;width:92px;height:92px;font-size:17px;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
#btnFire.on{background:rgba(255,74,61,.42);animation:firePulse .8s ease-in-out infinite}
@keyframes firePulse{50%{box-shadow:0 0 0 10px rgba(255,74,61,.18)}}
/* ---- online ekranları ---- */
.btn.sm{display:inline-block;width:auto;padding:9px 14px;margin:0;text-align:center;font-size:14px}
.row2{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.row2 input{flex:1;min-width:0}
input[type=text],input:not([type]){background:#0d150f;color:var(--white);border:1px solid var(--line2);padding:9px 10px;font-family:var(--sans);font-size:15px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
input:focus{outline:1px solid var(--amber)}
.onstat{display:flex;align-items:center;gap:8px;font-size:14px;margin:-4px 0 10px;color:#cfd8cc}
.onstat i{width:10px;height:10px;border-radius:50%;background:var(--grey);flex:none}
.onstat.on i{background:var(--green);box-shadow:0 0 8px var(--green)} .onstat.conn i{background:var(--amber);animation:blink 1s infinite} .onstat.err i{background:var(--red)}
@keyframes blink{50%{opacity:.25}}
details{margin:8px 0 12px;border:1px solid #2c4030;padding:8px 10px;background:rgba(0,0,0,.2)} summary{cursor:pointer;color:#cfd8cc;font-size:14px}
.rlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.rrow{display:flex;align-items:center;gap:10px;border:1px solid #2c4030;padding:8px 10px;background:rgba(0,0,0,.25)}
.rrow .rn{flex:1;min-width:0} .rrow .rn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .rrow .rn span{font-size:12.5px;color:var(--grey)}
.formbox{border:1px solid var(--line);padding:10px;margin:4px 0 10px;background:rgba(0,0,0,.25)}
.formbox .set{grid-template-columns:1fr 1.4fr;padding:6px 0}
table.lb td:first-child{width:44px;color:var(--amber);font-family:var(--mono)} table.lb tr.me td{background:rgba(255,176,0,.12)}
table.lb td:last-child{text-align:right;color:var(--white)}
.panel.wide{width:min(860px,100%)}
.rmgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:14px;margin-bottom:10px} @media (max-width:640px){.rmgrid{grid-template-columns:1fr}}
.mem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px dashed #2c4030;font-size:15px}
.mem .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none} .mem .dot.off{background:var(--grey)}
.mem .tag{font-size:11px;letter-spacing:.08em;border:1px solid var(--amber);color:var(--amber);padding:1px 5px}
.mem .tag.you{border-color:var(--green);color:var(--green)} .mem .sp{flex:1} .mem .btn.sm{padding:5px 9px;font-size:12px}
.chatbox{display:flex;flex-direction:column;min-height:220px;border:1px solid #2c4030;background:rgba(0,0,0,.3)}
.chatlog{flex:1;overflow-y:auto;padding:8px;font-size:14px;line-height:1.4;touch-action:pan-y;-webkit-overflow-scrolling:touch;min-height:0}
.chatlog p{margin:0 0 5px;word-wrap:break-word} .chatlog b{color:#7fd4ff;margin-right:5px} .chatlog p.mine b{color:var(--amber)} .chatlog p.sys{color:#9aa79a;font-style:italic;font-size:13px}
.chatbox .row2{margin:0;padding:6px;border-top:1px solid #2c4030}
.spinner{width:42px;height:42px;border:3px solid #2c4030;border-top-color:var(--amber);border-radius:50%;margin:16px auto;animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
#mBtnOnline .k{color:var(--green);opacity:.9}
/* ---- maç düzeni ---- */
#mp{display:none} body.mp #mp{display:block}
body.mp{--mpl:0px;--mpr:0px} body.mp.mp-dock{--mpl:240px;--mpr:290px}
body.mp #cv{left:var(--mpl);width:calc(100vw - var(--mpl) - var(--mpr))}
body.mp #touchUI{left:var(--mpl);right:var(--mpr)}
body.mp #toasts{right:calc(var(--mpr) + 12px)}
.mpside{position:fixed;top:0;bottom:0;z-index:16;display:flex;flex-direction:column;background:rgba(7,12,9,.95);border-color:var(--line);padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));touch-action:pan-y;transition:transform .25s ease}
#mpLeft{left:0;width:240px;border-right:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left))}
#mpRight{right:0;width:290px;border-left:1px solid var(--line);padding-right:max(10px,env(safe-area-inset-right))}
body.mp:not(.mp-dock) #mpLeft{width:min(260px,78vw);transform:translateX(-102%)} body.mp:not(.mp-dock) #mpRight{width:min(300px,84vw);transform:translateX(102%)}
body.mp:not(.mp-dock) #mpLeft.open,body.mp:not(.mp-dock) #mpRight.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.7)}
.mph{display:flex;justify-content:space-between;align-items:baseline;color:var(--amber);letter-spacing:.12em;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mph span{color:#cfd8cc;font-family:var(--mono);font-size:13px}
#mpScores{flex:1;overflow-y:auto}
.sc{display:grid;grid-template-columns:22px 1fr auto;grid-template-rows:auto auto;gap:2px 8px;padding:8px 6px;border-bottom:1px solid #1f2e22;transition:background .3s}
.sc .pl{grid-column:1;grid-row:1/3;color:var(--grey);font-family:var(--mono);font-size:14px;align-self:center}
.sc .nm{grid-column:2;grid-row:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sc .tt{grid-column:3;grid-row:1/3;align-self:center;font-family:var(--mono);font-size:19px;color:var(--amber)}
.sc .pips{grid-column:2;grid-row:2;display:flex;gap:4px;align-items:center} .sc .pips i{width:28px;height:7px;background:#25332a} .sc .pips i.hit{background:var(--green)} .sc .pips i.miss{background:var(--amber)} .sc .pips i.zero{background:var(--red)}
.sc .pips i.now{animation:blink .7s infinite;background:#e9efe6}
.sc.shooter{background:rgba(255,176,0,.13);box-shadow:inset 3px 0 0 var(--amber)} .sc.me .nm{color:var(--green)} .sc.gone{opacity:.45}
.sc .nx{font-size:11px;color:var(--grey);letter-spacing:.06em}
.sc.bump .tt{animation:bump .7s} @keyframes bump{30%{transform:scale(1.4);color:#fff}}
#mpRight .chatlog{border:1px solid #1f2e22;margin-bottom:6px}
#bMpLeave{margin-top:8px;width:100%}
.mptab{position:fixed;z-index:19;transition:left .25s ease,right .25s ease;top:38%;width:40px;height:52px;border:1px solid var(--line2);background:rgba(7,12,9,.85);color:var(--white);font-size:20px;display:none}
body.mp:not(.mp-dock) .mptab{display:block}
#mpTabL{left:0;border-left:0;padding-left:max(0px,env(safe-area-inset-left))} #mpTabR{right:0;border-right:0}
body.mp:not(.mp-dock) #mpLeft.open ~ #mpTabL{left:min(260px,78vw)} body.mp:not(.mp-dock) #mpRight.open ~ #mpTabR{right:min(300px,84vw)}
.mptab.x{font-size:18px;color:var(--amber)}
#mpTabR i{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:11px;font-style:normal;line-height:18px;display:none} #mpTabR i.on{display:block}
#mpTop{position:fixed;z-index:14;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 66px);font-size:13px;background:rgba(7,12,9,.8);border:1px solid var(--line);padding:3px 10px;white-space:nowrap;display:none;pointer-events:none}
body.mp:not(.mp-dock) #mpTop.on{display:block}
#mpFade{position:fixed;top:0;bottom:0;left:var(--mpl);right:var(--mpr);z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease}
#mpFade.on{opacity:.88}
#mpCard{position:fixed;z-index:18;left:var(--mpl);right:var(--mpr);top:50%;transform:translateY(-50%);display:none;pointer-events:none;text-align:center;padding:22px 16px 18px;background:linear-gradient(90deg,rgba(8,14,10,0),rgba(8,14,10,.94) 18%,rgba(8,14,10,.94) 82%,rgba(8,14,10,0));border-top:2px solid var(--amber);border-bottom:1px solid var(--line)}
#mpCard.on{display:block;animation:cardIn .45s cubic-bezier(.2,.9,.3,1)} @keyframes cardIn{from{opacity:0;transform:translateY(-50%) scaleY(.4)}}
#mpCard.btns{pointer-events:auto}
#mpCard .kick{font-family:var(--mono);letter-spacing:.3em;color:var(--amber);font-size:14px}
#mpCard .big{font-size:clamp(32px,6vw,64px);font-weight:800;letter-spacing:.06em;margin:6px 0 2px;animation:slideName .6s .1s both cubic-bezier(.2,.9,.3,1)} @keyframes slideName{from{opacity:0;transform:translateX(-40px)}}
#mpCard .sub{font-size:16px;color:#cfd8cc}
#mpCard .bar{height:4px;background:#25332a;margin:14px auto 0;width:min(420px,80%)} #mpCard .bar i{display:block;height:100%;background:var(--amber);width:100%}
#mpCard .nx{font-size:13px;color:var(--grey);margin-top:8px}
#mpCard.you .big{color:var(--green)} #mpCard.hit .big{color:var(--green)} #mpCard.miss .big{color:var(--amber)} #mpCard.zero .big{color:var(--red)}
#mpCard .pod{display:flex;flex-direction:column;gap:4px;width:min(440px,92%);margin:12px auto 6px;text-align:left}
#mpCard .pod div{display:flex;gap:10px;font-size:17px;padding:6px 10px;background:rgba(255,255,255,.04)} #mpCard .pod div b{flex:1} #mpCard .pod div span{font-family:var(--mono);color:var(--amber)}
#mpCard .pod div.p1{background:rgba(255,200,60,.16);font-size:20px}
#mpCard .row{justify-content:center;margin-top:10px} #mpCard .row .btn{flex:0 1 220px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.panel{padding:16px 14px}.set{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tutBox"><div class="st"></div><div class="tt"></div><div class="tx"></div><div class="dots"></div></div>
<div id="toasts"></div>
<div id="touchUI">
 <div id="joy"><div id="joyKnob"></div></div>
 <button id="btnLock" class="tbtn" data-t="t_lock">LOCK</button>
 <button id="btnFire" class="tbtn" data-t="t_fire">FIRE</button>
 <button id="btnPause" class="tsmall" aria-label="Pause">II</button>
 <button id="btnRadarT" class="tsmall" aria-label="Radar">R</button>
</div>

const WEATHER = {
  clear:   { sky:['#1d4c7d','#6fa3cf','#c9deec'], ground:['#56653f','#2c3722'], mtn:['#7a8c98','#566a5c'], cloudTint:[255,255,255], vis:30000, contrast:1.0,  lockMul:1.0,  clouds:5,  fog:0,   penalty:0,  light:1,   sun:{az:200,el:42,c:'#fff6d0'} },

};

const NET_EVENTS = ['particles.explosion','particles.puff','audio.launch','audio.explosion','audio.whoosh','audio.puff','audio.lockConfirm','audio.error','audio.detect','audio.warning','audio.countdown','audio.click','radio.say','assistant.say','game.flash'];
const GAME_STATE = Object.freeze({
  MENU:'MENU', BRIEFING:'BRIEFING', COUNTDOWN:'COUNTDOWN', READY:'READY',
  SEARCHING:'SEARCHING', TARGET_DETECTED:'TARGET_DETECTED', ACQUIRING:'ACQUIRING', LOCKED:'LOCKED', INTERCEPTING:'INTERCEPTING',
  LAUNCH:'LAUNCH', MISSILE_FLIGHT:'MISSILE_FLIGHT', HIT:'HIT', MISS:'MISS',
  TARGET_ATTACK:'TARGET_ATTACK', ESCAPED:'ESCAPED', NEXT_ATTEMPT:'NEXT_ATTEMPT',
  MISSION_COMPLETE:'MISSION_COMPLETE', MISSION_FAILED:'MISSION_FAILED'
});
const ENGAGE = new Set([GAME_STATE.SEARCHING, GAME_STATE.TARGET_DETECTED, GAME_STATE.ACQUIRING, GAME_STATE.LOCKED, GAME_STATE.INTERCEPTING]);
const PLAYER_VIEW_STATES = new Set([GAME_STATE.BRIEFING, GAME_STATE.COUNTDOWN, GAME_STATE.READY, GAME_STATE.LAUNCH, GAME_STATE.ESCAPED, GAME_STATE.TARGET_ATTACK, GAME_STATE.NEXT_ATTEMPT, GAME_STATE.MISSION_COMPLETE, GAME_STATE.MISSION_FAILED, ...ENGAGE]);

/* ---------- yardımcılar ---------- */
const D2R = Math.PI/180, R2D = 180/Math.PI, TAU = Math.PI*2;
const MONO = 'Consolas, "SF Mono", Menlo, "Liberation Mono", "Courier New", monospace';
const SANS = 'Bahnschrift, "DIN Condensed", "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif';
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const smooth = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const wrapPi = a => { a = (a+Math.PI)%TAU; if (a<0) a += TAU; return a-Math.PI; };
const wrap360 = d => ((d%360)+360)%360;
const fin = (v,d=0) => Number.isFinite(v)?v:d;
const pad = (n,w=2) => String(n).padStart(w,'0');
const V = {
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  scale:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  len:a=>Math.hypot(a.x,a.y,a.z),
  norm:a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return {x:a.x/l,y:a.y/l,z:a.z/l};},
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),
  lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t}),
  copy:a=>({x:a.x,y:a.y,z:a.z})
};
function dirAE(az,el){ const c=Math.cos(el); return {x:Math.sin(az)*c, y:Math.cos(az)*c, z:Math.sin(el)}; }
function aeOf(v){ return {az:Math.atan2(v.x,v.y), el:Math.atan2(v.z,Math.hypot(v.x,v.y))}; }
function angDeg(a,b){ return Math.acos(clamp(V.dot(V.norm(a),V.norm(b)),-1,1))*R2D; }
function rotateToward(cur,des,maxAng){
  const d=clamp(V.dot(cur,des),-1,1), ang=Math.acos(d);
  if (ang<=maxAng || ang<1e-6) return V.norm(des);
  const t=maxAng/ang, s=Math.sin(ang);
  if (s<1e-6) return V.norm(des);
  const a=Math.sin((1-t)*ang)/s, b=Math.sin(t*ang)/s;
  return V.norm({x:cur.x*a+des.x*b, y:cur.y*a+des.y*b, z:cur.z*a+des.z*b});
}
class RNG {
  constructor(seed){ this.s=(seed>>>0)||1; }
  next(){ let t=this.s+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }
  range(a,b){ return a+(b-a)*this.next(); }
  int(a,b){ return Math.floor(this.range(a,b+1)); }
  pick(arr){ return arr[Math.floor(this.next()*arr.length)%arr.length]; }
  chance(p){ return this.next()<p; }
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;
}
function diffLabel(ds){ return ds<=25?'EASY':ds<=50?'NORMAL':ds<=75?'HARD':'EXPERT'; }
function missScore(d){ return Math.max(0, Math.round(GAME_CONFIG.scoringDistanceLimit - d)); }

class MemoryBackend { constructor(){ this.m={}; } getItem(k){ return k in this.m?this.m[k]:null; } setItem(k,v){ this.m[k]=String(v); } removeItem(k){ delete this.m[k]; } }
function safeLocalStorage(){ try { const k='__stinger_t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return window.localStorage; } catch(e){ return new MemoryBackend(); } }
class StorageManager {
  constructor(backend,key=STORAGE_KEY){ this.backend=backend; this.key=key; this.data=this.load(); }

  save(){ try { this.backend.setItem(this.key, JSON.stringify(this.data)); return true; } catch(e){ return false; } }
  resetStats(){ const keep={settings:this.data.settings, training:this.data.training}; this.data=defaultSave(); Object.assign(this.data,keep); this.save(); }

class AudioManager {

  init(){

    this.bus={}; for (const k of ['music','radio','sfx']){ const g=c.createGain(); g.connect(this.master); this.bus[k]=g; }
    const len=c.sampleRate*2, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for (let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noiseBuf=b;

    const lf=c.createBiquadFilter(); lf.type='lowpass'; lf.frequency.value=2400;
    this.lockGain=c.createGain(); this.lockGain.gain.value=0;

  }

  setVolumes(s){ this.vol={master:s.master/100,music:s.music/100,radio:s.radio/100,sfx:s.sfx/100}; this.applyVolumes(); }
  applyVolumes(){ if (!this.ctx) return; const t=this.ctx.currentTime; this.master.gain.setTargetAtTime(this.muted?0:this.vol.master,t,.05); for (const k in this.bus) this.bus[k].gain.setTargetAtTime(this.vol[k],t,.05); }
  toggleMute(){ this.muted=!this.muted; this.applyVolumes(); return this.muted; }

  tone(freq,dur,type='sine',vol=.2,bus='sfx',delay=0,freqEnd=null){

class RadioManager {
  constructor(game){
    this.g=game; this.queue=[]; this.cur=null; this.nextAt=0; this.subtitle=null; this.log=[]; this.voices=[]; this.recent={};
    this.tts=(!game.headless&&typeof window!=='undefined'&&window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.TextToSpeech)||null;
    this.speechOK=!game.headless&&(!!this.tts||(typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'));
    if (this.speechOK){ const lv=()=>{ try { this.voices=window.speechSynthesis.getVoices()||[]; } catch(e){} }; lv(); try { window.speechSynthesis.addEventListener('voiceschanged',lv); } catch(e){} }
  }
  say(text,o={}){
    const it={text,speech:o.speech||text,speaker:o.speaker||'radio',priority:o.priority||1,kind:o.kind||'msg',shout:!!o.shout};
    const now=this.g.clock; if (this.recent[text]!==undefined&&now-this.recent[text]<4) return; this.recent[text]=now;
    this.log.push({t:now,text,speaker:it.speaker,kind:it.kind}); if (this.log.length>300) this.log.shift();
    if (it.kind==='dist') this.queue=this.queue.filter(q=>q.kind!=='dist');
    if (it.priority>=2){ this.queue=this.queue.filter(q=>q.priority>=2); if (this.cur&&this.cur.priority<2){ this.cancelSpeech(); this.cur=null; this.nextAt=0; } this.queue.unshift(it); }
    else this.queue.push(it);
    if (this.queue.length>5) this.queue.splice(0,this.queue.length-5);
  }
  update(){
    const now=this.g.clock;
    if (this.cur&&now>=this.cur.end){ if (this.cur.speaker==='radio') this.g.audio.radioEnd(); this.cur=null; this.nextAt=now+GAME_CONFIG.radioCooldown/1000; }
    if (!this.cur&&this.queue.length&&now>=this.nextAt){
      const it=this.queue.shift(); it.start=now; it.est=Math.min(7,.6+it.text.length*.06); it.end=now+it.est;
      this.cur=it; this.subtitle={speaker:it.speaker,text:it.text,shout:it.shout,t0:now,end:now+it.est+1.4};
      if (it.speaker==='radio') this.g.audio.radioStatic(it.shout);
      this.speak(it);
    }
    if (this.subtitle&&now>this.subtitle.end) this.subtitle=null;
  }
  speak(it){
    if (!this.speechOK||!this.g.settings.voice||this.g.audio.muted) return;
    if (this.tts){ const cur=it; it.end=it.start+it.est+2.5;
      const vol=clamp(this.g.audio.vol.radio*Math.max(.3,this.g.audio.vol.master),0,1);
      this.tts.speak({text:it.speech,lang:LANG==='en'?'en-US':'tr-TR',rate:it.shout?1.15:1.05,pitch:it.shout?1.2:(it.speaker==='assistant'?.85:1),volume:vol,category:'playback'})
        .then(()=>{ if (this.cur===cur) cur.end=Math.min(cur.end,this.g.clock); }).catch(()=>{}); return; }
    try {
      const u=new SpeechSynthesisUtterance(it.speech); u.lang=LANG==='en'?'en-US':'tr-TR';
      const v=this.voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(LANG)); if (v) u.voice=v;
      u.rate=it.shout?1.22:1.1; u.pitch=it.shout?1.2:(it.speaker==='assistant'?.85:1);
      u.volume=clamp(this.g.audio.vol.radio*Math.max(.3,this.g.audio.vol.master)*(it.shout?1:.9),0,1);
      it.end=it.start+it.est+2.5;
      const cur=it; u.onend=u.onerror=()=>{ if (this.cur===cur) cur.end=Math.min(cur.end,this.g.clock); };

  }
  cancelSpeech(){ if (this.tts){ try { this.tts.stop().catch(()=>{}); } catch(e){} return; } if (this.speechOK){ try { window.speechSynthesis.cancel(); } catch(e){} } }

class Camera {
  constructor(){ this.x=0; this.y=0; this.z=1.7; this.yaw=0; this.pitch=.1; this.fov=70*D2R; this.W=1280; this.H=720; this.update(); }

  update(){ const cy=Math.cos(this.yaw),sy=Math.sin(this.yaw),cp=Math.cos(this.pitch),sp=Math.sin(this.pitch);
    this.f={x:sy*cp,y:cy*cp,z:sp}; this.r={x:cy,y:-sy,z:0}; this.u=V.cross(this.r,this.f);

  projectRel(dx,dy,dz){ const zc=dx*this.f.x+dy*this.f.y+dz*this.f.z; if (zc<.5) return null; const xc=dx*this.r.x+dy*this.r.y, yc=dx*this.u.x+dy*this.u.y+dz*this.u.z; const s=this.F/zc; return {x:this.W/2+xc*s, y:this.H/2-yc*s, z:zc, s}; }
  project(p){ return this.projectRel(p.x-this.x,p.y-this.y,p.z-this.z); }
  projectDir(d){ return this.projectRel(d.x*1e5,d.y*1e5,d.z*1e5); }

  horizonY(){ return this.H/2+this.F*Math.tan(this.pitch); }
  lookAt(p){ const ae=aeOf({x:p.x-this.x,y:p.y-this.y,z:p.z-this.z}); this.yaw=ae.az; this.pitch=clamp(ae.el,-1.4,1.4); this.update(); }
}

/* ===================== NİŞAN (ağır fırlatıcı ataleti + sallantı) ===================== */
class AimController {
  constructor(){ this.setDirect(0,.1); this.n1=0; this.n2=0; }
  setDirect(az,el){ this.taz=az; this.tel=el; this.baz=az; this.bel=el; this.vaz=0; this.vel=0; this.az=az; this.el=el; }
  addInput(daz,del){ this.taz=wrapPi(this.taz+daz); this.tel=clamp(this.tel+del,-.08,1.45); }
  shift(daz){ this.taz=wrapPi(this.taz+daz); this.baz=wrapPi(this.baz+daz); }
  update(dt,swayAmp,t){
    const k=320, c=2*1.0*Math.sqrt(k); const n=Math.max(1,Math.ceil(dt/.008)), h=dt/n;
    for (let i=0;i<n;i++){ const ex=wrapPi(this.taz-this.baz), ey=this.tel-this.bel; this.vaz+=(k*ex-c*this.vaz)*h; this.vel+=(k*ey-c*this.vel)*h; this.baz=wrapPi(this.baz+this.vaz*h); this.bel+=this.vel*h; }
    this.n1+=(Math.random()-.5)*dt*5-this.n1*dt*1.5; this.n2+=(Math.random()-.5)*dt*5-this.n2*dt*1.5;
    this.n1=clamp(this.n1,-1,1); this.n2=clamp(this.n2,-1,1);
    const sAz=swayAmp*(Math.sin(t*1.1)*.5+Math.sin(t*2.7+1.3)*.25+this.n1), sEl=swayAmp*(Math.sin(t*.42)*.8+Math.sin(t*3.1)*.2+this.n2);
    this.az=wrapPi(this.baz+sAz); this.el=clamp(this.bel+sEl,-.1,1.5);
    if (!Number.isFinite(this.az)||!Number.isFinite(this.el)) this.setDirect(0,.1);
  }
  dir(){ return dirAE(this.az,this.el); }
}

/* ===================== HEDEF + SENARYO ===================== */
function scenarioDifficulty(def,tA,lateral,P,w){
  const speedS=clamp((48-tA)/22,0,1)*30, sizeS=clamp((30-def.size*P.sizeMul)/26,0,1)*18, manS=clamp(def.maneuver*P.maneuverMul,0,1.3)*22;
  const latS=Math.min(1,Math.abs(lateral)/3500)*10, sigS=(1-def.signature)*10, wxS=(w.penalty||0)*10;
  return clamp(Math.round(def.baseDiff*.25+speedS+sizeS+manS+latS+sigS+wxS-5),0,100);
}
function generateScenario(rng,diffKey,opt={}){
  const P=GAME_CONFIG.difficulty[diffKey], band=P.band, w=opt.weather||WEATHER.clear;
  let types=P.types||Object.keys(TARGET_TYPES);
  if (opt.exclude&&opt.exclude.length){ const f=types.filter(t=>!opt.exclude.includes(t)); if (f.length) types=f; }
  let best=null, bestD=Infinity;
  for (let i=0;i<40;i++){
    const typeKey=opt.forceType||rng.pick(types), def=TARGET_TYPES[typeKey];
    const altFt=Math.round(rng.range(def.altFt[0],def.altFt[1]));
    const tA=opt.forceAttackTime||rng.range(def.tAttack[0],def.tAttack[1])*P.timeMul;
    const dist0=rng.range(GAME_CONFIG.spawnDistance[0],GAME_CONFIG.spawnDistance[1]);
    const bearing=rng.range(0,TAU), lateral=rng.range(-1,1)*def.lateral*(P.lateralMul||1);
    const speed=(dist0-GAME_CONFIG.attackRange)/tA*GAME_CONFIG.targetSpeedMultiplier;
    const ds=scenarioDifficulty(def,tA,lateral,P,w);
    const d=ds<band[0]?band[0]-ds:(ds>band[1]?ds-band[1]:0);
    const sc={typeKey,altFt,tA,dist0,bearing,lateral,speed,ds};
    if (d===0){ best=sc; break; } if (d<bestD){ bestD=d; best=sc; }
  }
  return best;
}
class Target {
  constructor(sc,rng){
    this.typeKey=sc.typeKey; this.def=TARGET_TYPES[sc.typeKey]; this.rng=rng;
    this.bearing0=sc.bearing; this.dist0=sc.dist0; this.lateral=sc.lateral; this.speed=sc.speed; this.curSpeed=sc.speed;
    this.ds=sc.ds; this.diffLabel=diffLabel(sc.ds);
    const altM=sc.altFt/3.28084; this.altBase=altM; this.altTarget=altM;
    this.pos={x:Math.sin(sc.bearing)*sc.dist0, y:Math.cos(sc.bearing)*sc.dist0, z:altM};
    this.heading=wrapPi(sc.bearing+Math.PI); this.vel={x:Math.sin(this.heading)*sc.speed, y:Math.cos(this.heading)*sc.speed, z:0};
    this.ai='APPROACH'; this.t=0; this.alive=true; this.phase=rng.range(0,TAU); this.phase2=rng.range(0,TAU);
    this.maneuverT=rng.range(2,5); this.mDur=0; this.evadeT=0; this.evadeSign=1; this.escapeHeading=0; this.minGr=sc.dist0; this.screenAng=0; this.rotor=0;
  }
  destroy(){ this.alive=false; this.ai='DESTROYED'; this.vel={x:this.vel.x*.35, y:this.vel.y*.35, z:-15}; }
  update(dt,player,ctx){

    this.t+=dt; const P=ctx.params, d=this.def, FA=GAME_CONFIG.finalApproachRange;
    const gr=Math.hypot(player.x-this.pos.x, player.y-this.pos.y);

    else if (this.ai==='CRUISE'){ this.maneuverT-=dt; if (this.maneuverT<=0){ this.maneuverT=this.rng.range(3,6); if (this.rng.chance(clamp(d.maneuver*P.maneuverMul,0,.95))){ this.ai='MANEUVER'; this.mDur=this.rng.range(2.5,5); } } }
    else if (this.ai==='MANEUVER'){ this.mDur-=dt; if (this.mDur<=0) this.ai='CRUISE'; }
    else if (this.ai==='EVADE'){ this.evadeT-=dt; if (this.evadeT<=0){ this.ai='CRUISE'; this.altTarget=this.altBase; } }
    if ((this.ai==='APPROACH'||this.ai==='CRUISE'||this.ai==='MANEUVER'||this.ai==='EVADE')&&gr<FA){ this.ai='FINAL_APPROACH'; this.altTarget=Math.min(this.altBase,d.attackAlt); }

      const px=Math.cos(this.bearing0), py=-Math.sin(this.bearing0);

      else if (this.ai==='MANEUVER') w=Math.sin(this.t*.9+this.phase)*.55*man;
      else if (this.ai==='EVADE') w=this.evadeSign*.7+Math.sin(this.t*2.2)*.25;
      else if (this.ai==='FINAL_APPROACH') w=Math.sin(this.t*.8+this.phase)*.06*man;

    let sp=this.speed*(1+.06*Math.sin(this.t*.5+this.phase2)); if (this.ai==='EVADE') sp*=1.12; if (this.ai==='ESCAPE') sp*=1.15;

    const maxClimb=this.typeKey==='HELO'?15:(d.turn>.3?60:30);

}

/* ===================== KİLİT ===================== */
class LockSystem {
  constructor(g){ this.g=g; this.reset(); }
  reset(){ this.progress=0; this.locked=false; this.acquiring=false; this.stability=0; this.lostTimer=0; this.acqTime=0; this.err=99; this.rate=0; this.prev=null; this.q=0; this.signal=0; this.lastLockTime=0; this.needRelease=false; }
  measure(dt){ const g=this.g, a=g.aim; const dAz=wrapPi(a.az-g.tAz)*Math.cos(g.tEl)*R2D, dEl=(a.el-g.tEl)*R2D;
    this.err=Math.hypot(dAz,dEl);
    if (this.prev&&dt>0){ const r=Math.hypot(dAz-this.prev.x,dEl-this.prev.y)/dt; this.rate+=(fin(r)-this.rate)*(1-Math.exp(-dt/.15)); }
    this.prev={x:dAz,y:dEl}; }
  update(dt,held,pressed){
    const g=this.g, P=g.params; this.measure(dt);
    const S=g.seekerSignal(); this.signal=S;
    const q=S*smooth(P.tol*2,P.tol*.35,this.err)*smooth(P.rateTol,P.rateTol*.25,this.rate); this.q=q;
    if (!held) this.needRelease=false;
    if (!this.locked){
      if (pressed&&!this.needRelease&&!this.acquiring){ this.acquiring=true; this.acqTime=0; this.progress=0; this.lostTimer=0; g.onAcquireStart(); }
      if (!this.acquiring) return;
      if (!held){ if (this.progress>.35) g.onLockLost('release'); this.acquiring=false; this.progress=0; return; }
      this.acqTime+=dt;
      if (q>.15) this.progress+=dt/P.lockTime*clamp((q-.15)/.45,0,1); else this.progress-=dt*.5;
      this.progress=clamp(this.progress,0,1);
      if (this.err>P.tol*3) this.lostTimer+=dt; else this.lostTimer=Math.max(0,this.lostTimer-dt*2);
      if (this.lostTimer>GAME_CONFIG.lockLostGrace&&this.acqTime>.3){ this.acquiring=false; this.progress=0; this.needRelease=true; g.onLockLost('drift'); return; }
      if (this.progress>=1){ this.locked=true; this.acquiring=false; this.stability=Math.max(q,.6); this.lastLockTime=this.acqTime; this.lostTimer=0; g.onLocked(this.acqTime); }
    } else {
      const keep=P.keepTol, S2=clamp(S*1.35,0,1);
      const st=S2*smooth(keep,keep*.3,g.lockAimErr())*smooth(P.rateTol*1.6,P.rateTol*.3,this.rate);
      this.stability+=(st-this.stability)*(1-Math.exp(-dt/.3));
      if (st<.1) this.lostTimer+=dt; else this.lostTimer=0;
      if (this.lostTimer>.6){ this.locked=false; this.progress=0; this.stability=0; this.needRelease=held; g.onLockLost('lost'); }
    }
  }
}

/* ===================== ÖNLEME ===================== */
class InterceptSystem {
  constructor(g){ this.g=g; this.reset(); }
  reset(){ this.pipDir=null; this.pipPos=null; this.pipAz=0; this.pipEl=0; this.leadErr=99; this.quality=0; this.window='EARLY'; this.tof=0; this.leadH=0; this.leadV=0; }
  windowFor(range){ const rw=GAME_CONFIG.rangeWindow; return range>rw.max?'EARLY':(range<rw.min?'LATE':'VALID'); }
  update(range){
    const g=this.g, t=g.target, cfg=GAME_CONFIG, eye=g.eye();
    const rel=V.sub(t.pos,eye), vt=t.vel, vm=cfg.missileAvgSpeed*cfg.missileSpeedMultiplier;
    const a=V.dot(vt,vt)-vm*vm, b=2*V.dot(rel,vt), c=V.dot(rel,rel);
    let tt=range/vm; const disc=b*b-4*a*c;
    if (Math.abs(a)>1e-6&&disc>=0){ const s=Math.sqrt(disc); const c2=[(-b-s)/(2*a),(-b+s)/(2*a)].filter(x=>x>0); if (c2.length) tt=Math.min(...c2); }
    this.tof=tt;
    const pip=V.add(t.pos,V.scale(vt,tt)); const aT=aeOf(rel), aP=aeOf(V.sub(pip,eye));
    const ce=Math.max(.05,Math.cos(aT.el));
    // yatay: hedefin gidiş yönünde biraz önde (derece, gökyüzü üzerinde)
    let hz=wrapPi(aP.az-aT.az)*ce*R2D*cfg.leadScale; const mag=Math.abs(hz);
    if (mag>.05) hz=Math.sign(hz)*clamp(mag,cfg.minLeadDeg,cfg.maxLeadDeg); else hz=0;
    // dikey: her zaman çok az yukarıda
    let up=clamp((aP.el-aT.el)*R2D*cfg.leadScale,-cfg.maxLeadVertDeg,cfg.maxLeadVertDeg)+cfg.superElevationDeg;
    up=clamp(up,cfg.minAboveDeg,cfg.maxAboveDeg);
    this.leadH=hz; this.leadV=up;
    this.pipAz=wrapPi(aT.az+hz*D2R/ce); this.pipEl=aT.el+up*D2R; this.pipDir=dirAE(this.pipAz,this.pipEl); this.pipPos=V.add(eye,V.scale(this.pipDir,range));
    const eAz=wrapPi(g.aim.az-this.pipAz)*Math.cos(this.pipEl)*R2D, eEl=(g.aim.el-this.pipEl)*R2D;
    this.leadErr=Math.hypot(eAz,eEl); this.quality=clamp(1-this.leadErr/g.params.iTol,0,1);
    this.window=this.windowFor(range);
  }
}

class Missile {

function angPassed(a0,a1,x){ return a1>=a0?(x>a0&&x<=a1):(x>a0||x<=a1); }
class Radar {
  constructor(){ this.sweep=0; this.blip=null; this.visible=true; this.decoys=[]; }
  update(dt,g){
    const prev=this.sweep; this.sweep=(this.sweep+dt*TAU/2.4)%TAU;
    if (this.sweep<prev&&(ENGAGE.has(g.state)||g.state===GAME_STATE.READY)) g.audio.radarPing();
    const t=g.target;
    if (t&&t.alive&&!(g.contact&&g.contact.lost)&&g.state!==GAME_STATE.MENU){
      let b=Math.atan2(t.pos.x-g.player.x,t.pos.y-g.player.y); if (b<0) b+=TAU;
      const r=Math.hypot(t.pos.x-g.player.x,t.pos.y-g.player.y);
      if (r<GAME_CONFIG.radarRange&&angPassed(prev,this.sweep,b)) this.blip={b,r,hdg:t.heading,t:g.clock};
    }
    if (g.contact&&g.contact.lost) this.blip=null;
    if (g.state===GAME_STATE.MENU){ if (this.decoys.length<3&&Math.random()<dt*.4) this.decoys.push({b:Math.random()*TAU,r:.3+Math.random()*.65,t:g.clock}); this.decoys=this.decoys.filter(d=>g.clock-d.t<5); }
  }
}

function assistantLayout(W,H){ const k=clamp(Math.min(W,H)/720,.48,1.3); const bx=Math.max(78*k,W*.1); const by=H+12*k; return {k,bx,by,shX:bx+36*k,shY:by-170*k}; }
class Assistant {
  constructor(){ this.arm=1.1; this.t=0; this.bubble=null; this.alert=0; this.wounded=false; this.headTurn=0; this.pointing=false; }
  reset(){ this.bubble=null; this.wounded=false; this.alert=0; }
  say(text){ this.bubble={text,t:0}; this.alert=1; }
  update(dt,g){
    this.t+=dt; if (this.bubble){ this.bubble.t+=dt; if (this.bubble.t>3.4) this.bubble=null; } this.alert=Math.max(0,this.alert-dt*.4);
    const t=g.target, cam=g.cam; let target=1.1; this.pointing=false;
    if (t&&t.alive&&g.state!==GAME_STATE.MENU&&g.viewCam===cam){
      const lay=assistantLayout(cam.W,cam.H), cs=cam.camSpace(t.pos);
      if (cs.z>.5){ const px=cam.W/2+cs.x/cs.z*cam.F, py=cam.H/2-cs.y/cs.z*cam.F;
        target=(px>-60&&px<cam.W+60&&py>-60&&py<cam.H+60)?Math.atan2(py-lay.shY,px-lay.shX):Math.atan2(-cs.y,cs.x); }
      else target=Math.atan2(-cs.y,cs.x);

      hitRate:this.shots.length?hits.length/this.shots.length:0, acqRate:this.attemptsTotal?Math.min(1,this.successfulLocks/this.attemptsTotal):0,
      shotScoreSum:this.scoreSoFar, avgShotScore:avg(this.shots.map(s=>s.score)), longestHit:hits.length?Math.max(...hits.map(s=>s.range)):0,

}
function evaluateRibbons(s){
  const crit=[s.fastHits>0,s.hardKills>0,s.maxCombo>=2,s.typesDestroyed.length>=2].filter(Boolean).length;
  return { atis:s.hits>=1, harekat:crit>=2, lojistik:s.hits>=2&&s.hits===s.missilesUsed&&s.forfeited===0,

function computeTotal(s,ribbons,scoreMul){

}

/* ===================== OYUN ===================== */
class Game {
  constructor(opts={}){
    this.headless=!!opts.headless; this.storage=opts.storage; this.settings=this.storage.data.settings;
    LANG=this.settings.lang||'tr';
    this.audio=opts.audio||new AudioManager(false); this.ui=opts.ui||NULL_UI;
    this.input=new InputState(); this.cam=new Camera(); this.mCam=new Camera(); this.rCam=new Camera(); this.viewCam=this.cam;
    this.W=1280; this.H=720; this.setViewport(opts.width||1280,opts.height||720);
    this.clock=0; this.paused=false; this.state=GAME_STATE.MENU; this.stateT=0;
    this.player={x:0,y:0,health:100}; this.aim=new AimController(); this.lock=new LockSystem(this); this.intercept=new InterceptSystem(this);
    this.radar=new Radar(); this.assistant=new Assistant(); this.particles=new ParticleSystem(this); this.radio=new RadioManager(this);
    this.target=null; this.missile=null; this.bomb=null; this.mission=null; this.tutorial=null; this.newAch=[];
    this.weatherKey='sunset'; this.weather=WEATHER.sunset; this.world=buildWorld(new RNG(1234)); this.clouds=[]; this.genClouds(new RNG(77));
    this.flashMsg=null; this.banner=null; this.comboMsg=null; this.readout=null; this.shake=0; this.timeScale=1; this.bob=0; this.moving=false; this.warning=false;
    this.fxRng=new RNG((Math.random()*1e9)|0); this.scRng=new RNG(1);
    this.timer={left:GAME_CONFIG.missionTime,running:false}; this.calls={km:99,detected:false}; this.contact={lost:false,done:true};
    this.attemptInfo={}; this.attemptOutcome={}; this.range=99999; this.groundRange=99999; this.tAz=0; this.tEl=0; this.bearingDeg=0; this.losRate=0; this.occluded=false;
    this.params={tol:1,keepTol:5,rateTol:7,lockTime:2,iTol:2}; this.chatterT=4; this.menuMode=true;
    this.cam.pitch=.1; this.cam.update();
  }
  setViewport(W,H){ this.W=W; this.H=H; this.cam.setViewport(W,H); this.mCam.setViewport(W,H); this.rCam.setViewport(W,H); }
  setState(s){ this.state=s; this.stateT=0; }
  get P(){ return GAME_CONFIG.difficulty[this.mission?this.mission.diffKey:'NORMAL']; }
  eye(){ return {x:this.player.x,y:this.player.y,z:1.7}; }
  isPlaying(){ return !!this.mission&&this.mode!=='spectate'&&this.state!==GAME_STATE.MENU&&this.state!==GAME_STATE.MISSION_COMPLETE&&this.state!==GAME_STATE.MISSION_FAILED; }
  isPlayerView(){ return PLAYER_VIEW_STATES.has(this.state)&&this.viewCam===this.cam; }
  vibrate(p){ if (this.headless||!this.settings.vibration) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
  flash(text,sub='',color='#ffb000',dur=1.4){ this.flashMsg={text,sub,color,t:0,dur}; }
  unlock(id){ const a=this.storage.data.achievements; if (a[id]) return; a[id]=Date.now(); this.storage.save(); this.newAch.push(id); const tx=(ACH_TEXT[LANG]||ACH_TEXT.tr)[id]; this.ui.toast(L('ach_unlocked'),(ACH_ICON[id]||'')+' '+(tx?tx[0]:id)); this.audio.tone(1320,.12,'triangle',.05); this.audio.tone(1760,.2,'triangle',.05,'sfx',.12); }

  genClouds(rng){ const w=this.weather; this.clouds=[]; for (let i=0;i<w.clouds;i++){ const az=rng.range(0,TAU), el=rng.range(3,22)*D2R, d=rng.range(5000,14000); const p=V.scale(dirAE(az,el),d); this.clouds.push({pos:p,w:rng.range(700,2300),a:rng.range(.45,.9),idx:rng.int(0,2)}); } }

  /* ---------- görev akışı ---------- */
  startMission(mode='normal',diffKey='NORMAL',opt={}){
    const tr=mode==='training', on=mode==='online'; this.mode=mode; this.missionOpt=opt; this.lastDiffKey=diffKey; this.mirror=null;
    const C=GAME_CONFIG;
    this.mission=new MissionManager({mode,diffKey:tr?'TRAINING':diffKey,missiles:tr?C.training.missiles:(on?1:C.missilesPerMission),apm:tr?C.training.attemptsPerMissile:(on?1:C.attemptsPerMissile),missionTime:tr?C.training.missionTime:C.missionTime,daily:opt.daily||null});
    this.scRng=new RNG(opt.seed!=null?opt.seed:(Math.random()*1e9)|0);
    this.player={x:0,y:0,health:100}; this.newAch=[]; this.assistant.reset();
    this.cam.yaw=0; this.cam.pitch=.12; this.cam.fov=C.fov.search*D2R; this.cam.update(); this.aim.setDirect(0,.12);
    this.target=null; this.missile=null; this.bomb=null; this.particles.clear(); this.radio.clear(); this.lock.reset(); this.intercept.reset(); this.input.clear();
    this.timer={left:this.mission.missionTime,running:false}; this.flashMsg=null; this.banner=null; this.comboMsg=null; this.readout=null; this.timeScale=1; this.viewCam=this.cam;
    const wantTut=opt.tutorial!==false;
    if (tr&&opt.guided&&wantTut) this.tutorial=new Tutorial(this,'guided');
    else if (!tr&&!on&&wantTut&&!this.headless&&!this.storage.data.flags.seenHints) this.tutorial=new Tutorial(this,'hints');
    else this.tutorial=null;
    this.paused=false; this.setState(on?GAME_STATE.COUNTDOWN:GAME_STATE.BRIEFING); this.countN=4;
    this.weatherKey=opt.forceWeather||(opt.daily&&opt.daily.weather)||'clear'; this.weather=WEATHER[this.weatherKey]; this.genClouds(this.scRng);
    this.audio.stopMusic(); this.audio.startAmbient();
    this.ui.onMissionStart(this);
    if (!on) this.radio.say(L('r_start'),{priority:1});
  }
  startAttempt(){
    const m=this.mission, opt=this.missionOpt||{}; if (!m) return;
    let wk=opt.forceWeather||(m.daily&&m.daily.weather);
    if (!wk) wk=m.mode==='training'?this.scRng.pick(['clear','sunrise','sunset','cloudy']):this.scRng.pick(Object.keys(WEATHER));
    this.weatherKey=wk; this.weather=WEATHER[wk]; this.genClouds(this.scRng);
    const exclude=(m.daily&&m.daily.differentTypes)?m.typesSeen:null;
    const sc=generateScenario(this.scRng,m.diffKey,{forceType:opt.forceType,forceAttackTime:opt.forceAttackTime,weather:this.weather,exclude});
    this.target=new Target(sc,new RNG(this.scRng.int(1,2e9))); m.typesSeen.push(sc.typeKey); m.attemptIndex++;
    this.timer={left:m.missionTime,running:false};
    this.lock.reset(); this.intercept.reset(); this.missile=null; this.bomb=null; this.input.lockHeld=false;
    this.calls={km:99,inRange:false,inRangeAt:-99,warn:false,detected:false,nextAssist:3,warnBeep:0};
    this.contact={lost:false,done:!!opt.noContactLoss||!this.scRng.chance(GAME_CONFIG.contactLostChance),at:this.scRng.range(6500,9000),dur:this.scRng.range(4,6),t:0};
    this.attemptInfo={contactLostOccurred:false}; this.attemptOutcome={}; this.radar.blip=null;
    this.timeScale=1; this.viewCam=this.cam; this.warning=false; this.readout=null; this.banner=null;
    this.range=V.len(V.sub(this.target.pos,this.eye())); this.groundRange=this.range;
    { const ae=aeOf(V.sub(this.target.pos,this.eye())); this.tAz=ae.az; this.tEl=ae.el; this.losRate=0; this.bearingDeg=wrap360(ae.az*R2D); }
    this.audio.startEngine(this.target.def.sound);
    if (this.tutorial) this.tutorial.onNewAttempt();
    this.setState(GAME_STATE.READY); this.ui.hideScreens();
  }
  beginEngagement(){ this.timer.running=true; this.setState(GAME_STATE.SEARCHING); }
  continueNext(){ if (this.state===GAME_STATE.NEXT_ATTEMPT) this.startAttempt(); }

  /* ---------- ana adım ---------- */
  step(dtR){
    if (this.paused) return;
    dtR=clamp(fin(dtR,0),0,.1);
    if (this.mode==='spectate'){ this.stepMirror(dtR); return; }
    this.clock+=dtR; this.stateT+=dtR;
    const S=GAME_STATE, dt=dtR*this.timeScale;
    this.shake=Math.max(0,this.shake-dtR*2.2);
    this.radio.update(); this.particles.update(dt);
    if (this.flashMsg){ this.flashMsg.t+=dtR; if (this.flashMsg.t>this.flashMsg.dur) this.flashMsg=null; }
    if (this.comboMsg){ this.comboMsg.t+=dtR; if (this.comboMsg.t>2) this.comboMsg=null; }
    if (this.banner&&this.clock-this.banner.t>this.banner.dur) this.banner=null;
    switch (this.state){
      case S.MENU: this.cam.yaw=wrapPi(this.cam.yaw+dtR*.025); this.cam.pitch=.09; this.cam.fov=70*D2R; this.cam.x=0; this.cam.y=0; this.cam.z=1.7; this.cam.update(); this.viewCam=this.cam; this.menuChatter(dtR); break;
      case S.BRIEFING: this.updatePlayerView(dtR,false); if (this.stateT>2.2){ this.setState(S.COUNTDOWN); this.countN=4; } break;
      case S.COUNTDOWN: { this.updatePlayerView(dtR,false); const n=3-Math.floor(this.stateT); if (n!==this.countN&&n>0){ this.countN=n; this.audio.countdown(n); } if (this.stateT>=3.6){ this.audio.countdown(0); this.startAttempt(); } break; }
      case S.READY: this.updatePlayerView(dtR,true); if (this.stateT>1.2) this.beginEngagement(); break;
      case S.LAUNCH: case S.MISSILE_FLIGHT: this.updateMissilePhase(dtR,dt); break;
      case S.HIT: case S.MISS: this.updateResult(dtR,dt); break;
      case S.TARGET_ATTACK: this.updateAttack(dtR,dt); break;
      case S.ESCAPED: this.updatePlayerView(dtR,true); if (this.target) this.target.update(dt,this.player,this.tctx()); if (this.stateT>2.4) this.resolveAttempt(); break;
      case S.NEXT_ATTEMPT: case S.MISSION_COMPLETE: case S.MISSION_FAILED: this.updatePlayerView(dtR,false); if (this.target) this.target.update(dt,this.player,this.tctx()); break;
      default: if (ENGAGE.has(this.state)) this.updateEngagement(dtR,dt);
    }
    this.radar.update(dtR,this);
    if (this.tutorial) this.tutorial.update(dtR);
    this.assistant.update(dtR,this);
    this.updateAudioLoops(dtR);
    if (!PLAYER_VIEW_STATES.has(this.state)){ this.input.aimDX=0; this.input.aimDY=0; }
    this.input.endFrame();
  }
  tctx(){ return {locked:this.lock.locked,params:this.P}; }
  menuChatter(dt){ this.chatterT-=dt; if (this.chatterT<=0){ this.chatterT=6+Math.random()*7; this.audio.radioStatic(false); } }

  updatePlayerView(dt,allowMove){
    const inp=this.input, k=inp.keys, C=GAME_CONFIG;
    let mx=0,my=0;
    if (allowMove){ if (k.ArrowUp||k.KeyW) my+=1; if (k.ArrowDown||k.KeyS) my-=1; if (k.ArrowLeft||k.KeyA) mx-=1; if (k.ArrowRight||k.KeyD) mx+=1; mx+=inp.joyX; my+=inp.joyY; }
    const ml=Math.hypot(mx,my); if (ml>1){ mx/=ml; my/=ml; }
    this.moving=ml>.05;
    if (this.moving){ const yaw=this.cam.yaw, sp=C.moveSpeed*dt; this.player.x+=(Math.sin(yaw)*my+Math.cos(yaw)*mx)*sp; this.player.y+=(Math.cos(yaw)*my-Math.sin(yaw)*mx)*sp;
      const B=C.moveBounds; this.player.x=clamp(this.player.x,-B,B); this.player.y=clamp(this.player.y,-B,B); this.bob+=dt*9; }
    let turn=0; if (k.KeyQ) turn-=1; if (k.KeyE) turn+=1; turn+=inp.turn+inp.edgeTurn;
    if (turn){ const d=clamp(turn,-1.5,1.5)*C.turnSpeed*dt*(this.cam.fov/(70*D2R)); this.cam.yaw=wrapPi(this.cam.yaw+d); this.aim.shift(d); }
    if (inp.aimDX||inp.aimDY){ const dpp=(this.cam.fov/this.W)*this.settings.sensitivity; this.aim.addInput(inp.aimDX*dpp,(this.settings.invertY?1:-1)*inp.aimDY*dpp); inp.aimDX=0; inp.aimDY=0; }
    const lockedView=this.lock.locked&&ENGAGE.has(this.state)&&!!this.target;
    if (lockedView) this.clampAimToSight();
    const swayAmp=C.swayDeg*D2R*(this.moving?C.moveSwayMul:1);
    this.aim.update(dt,swayAmp,this.clock);
    let fovT=C.fov.search; if (this.lock.locked&&ENGAGE.has(this.state)) fovT=C.fov.locked; else if (this.lock.acquiring) fovT=lerp(C.fov.search,C.fov.acquire,smooth(0,1,this.lock.progress*1.4+.25));
    this.cam.fov+=(fovT*D2R-this.cam.fov)*Math.min(1,dt*4);
    if (lockedView){ // kilitte görüş hedefi (ve önleme noktasını) izler, nişangâh serbest
      const ic=this.intercept; let cAz=this.tAz, cEl=this.tEl; if (ic.pipDir){ cAz=wrapPi(this.tAz+wrapPi(ic.pipAz-this.tAz)*.5); cEl=(this.tEl+ic.pipEl)/2; }
      const k=1-Math.exp(-dt*6); this.cam.yaw=wrapPi(this.cam.yaw+wrapPi(cAz-this.cam.yaw)*k); this.cam.pitch+=(cEl-this.cam.pitch)*k;
    } else { // aramada görüş doğrudan nişanı izler (klasik FPS hissi, ters kayma yok)
      const k=1-Math.exp(-dt*30); this.cam.yaw=wrapPi(this.cam.yaw+wrapPi(this.aim.baz-this.cam.yaw)*k); this.cam.pitch+=(this.aim.bel-this.cam.pitch)*k;
    }
    this.cam.pitch=clamp(this.cam.pitch,-.1,1.3);
    this.cam.x=this.player.x; this.cam.y=this.player.y; this.cam.z=1.7+(this.moving?Math.sin(this.bob)*.04:0);
    this.cam.update(); this.viewCam=this.cam;
  }

  computeParams(){
    const P=this.P, w=this.weather, t=this.target, C=GAME_CONFIG; let visAng=0;
    if (t){ visAng=Math.atan((t.def.size*C.visualScale*P.sizeMul)/Math.max(50,this.range))*R2D; }
    const tol=C.acquisitionTolerance*P.tolMul/w.lockMul+visAng*.35;
    this.params={tol,keepTol:tol*3+C.lockKeepBase,rateTol:C.trackRateTolerance*P.rateTolMul,lockTime:C.lockTime*P.lockTimeMul*C.lockDifficulty*w.lockMul,iTol:C.interceptWindow*P.interceptMul};
    const eye=this.eye(), rel=V.sub(t.pos,eye); this.occluded=false;
    for (const cl of this.clouds){ const dc=V.sub(cl.pos,eye), dcl=V.len(dc); if (dcl>this.range) continue; if (angDeg(dc,rel)<Math.atan(cl.w*.3/dcl)*R2D){ this.occluded=true; break; } }
  }
  clampAimToSight(){ // nişangâh gez-göz dairesinin içinde kalsın
    const maxA=Math.min(this.W,this.H)*.42*.85/Math.max(1,this.cam.F), a=this.aim, cp=Math.max(.05,Math.cos(this.cam.pitch));
    let dx=wrapPi(a.taz-this.cam.yaw)*cp, dy=a.tel-this.cam.pitch; const d=Math.hypot(dx,dy);
    if (d>maxA){ dx*=maxA/d; dy*=maxA/d; a.taz=wrapPi(this.cam.yaw+dx/cp); a.tel=this.cam.pitch+dy; }
  }
  muzzlePos(){ // omuzdaki fırlatıcı tüpünün ağzı (nişan yönünde, sağda ve biraz aşağıda)
    const a=this.aim, f=a.dir(), r={x:Math.cos(a.az),y:-Math.sin(a.az),z:0}, u=V.cross(r,f), e=this.eye();
    return V.add(e,V.add(V.scale(f,1.2),V.add(V.scale(r,.34),V.scale(u,-.17))));
  }
  lockAimErr(){ // nişanın hedef→önleme noktası koridoruna açısal uzaklığı (derece)
    const a=this.aim, ic=this.intercept, ce=Math.cos(this.tEl);
    const ax=wrapPi(a.az-this.tAz)*ce*R2D, ay=(a.el-this.tEl)*R2D;
    if (!ic.pipDir) return Math.hypot(ax,ay);
    const px=wrapPi(ic.pipAz-this.tAz)*ce*R2D, py=(ic.pipEl-this.tEl)*R2D, dd=px*px+py*py;
    const s=dd>1e-9?clamp((ax*px+ay*py)/dd,0,1):0;
    return Math.hypot(ax-px*s,ay-py*s);
  }
  seekerSignal(){
    const t=this.target; if (!t||!t.alive) return 0; const r=this.range, C=GAME_CONFIG, w=this.weather;
    const rf=r<=4000?1:Math.pow(clamp(1-(r-4000)/(C.seekerAcqRange-4000),0,1),.5);
    const vis=w.vis, ff=clamp(1-(r-vis*.6)/(vis*.4),0,1);
    return clamp(t.def.signature*w.contrast*rf*ff*(this.occluded?.25:1)*(this.mode==='training'?1.25:1),0,1);
  }
  targetOnScreen(){ if (!this.target) return false; const p=this.cam.project(this.target.pos); return !!p&&p.x>0&&p.x<this.W&&p.y>0&&p.y<this.H; }
  targetOnRadar(){ return !!this.target&&!!this.radar.blip&&!this.contact.lost; }

  updateEngagement(dtR,dt){
    const S=GAME_STATE, t=this.target, C=GAME_CONFIG;
    this.updatePlayerView(dtR,true);
    t.update(dt,this.player,this.tctx());
    if (this.timer.running){ this.timer.left=Math.max(0,this.timer.left-dtR); if (this.timer.left<=0){ this.timeExpired(); return; } }
    const eye=this.eye(), rel=V.sub(t.pos,eye); this.range=V.len(rel); this.groundRange=Math.hypot(t.pos.x-this.player.x,t.pos.y-this.player.y);
    const ae=aeOf(rel); const pAz=this.tAz, pEl=this.tEl; this.tAz=ae.az; this.tEl=ae.el; this.bearingDeg=wrap360(ae.az*R2D);
    if (dtR>0){ const r=Math.hypot(wrapPi(this.tAz-pAz)*Math.cos(this.tEl),this.tEl-pEl)*R2D/dtR; this.losRate+=(fin(r)-this.losRate)*Math.min(1,dtR*3); }
    this.computeParams(); this.updateContact(dtR);
    if (!this.calls.detected&&this.range<C.detectRange){ this.calls.detected=true; this.audio.detect(); this.flash('TARGET DETECTED','',  '#ffb000',1.3); this.assistantSay(L('r_detect',this.clockOf()),2); }
    this.updateRadioCalls();
    const inp=this.input; this.lock.update(dtR,inp.lockHeld,inp.lockPressed);
    if (this.lock.locked) this.intercept.update(this.range); else this.intercept.window=this.intercept.windowFor(this.range);
    let ns; if (this.lock.locked) ns=this.intercept.window==='VALID'?S.INTERCEPTING:S.LOCKED; else if (this.lock.acquiring) ns=S.ACQUIRING; else ns=this.calls.detected?S.TARGET_DETECTED:S.SEARCHING;
    if (ns!==this.state) this.state=ns;
    if (inp.firePressed&&this.tryFire()) return;
    if (t.ai==='FINAL_APPROACH'&&this.groundRange<C.attackRange){ this.beginAttack(); return; }
    const c=this.calls;
    if (this.groundRange<C.warningRange&&t.ai!=='ESCAPE'){ if (!c.warn){ c.warn=true; this.radio.say(L('r_warn'),{priority:2}); } this.warning=true; c.warnBeep-=dtR; if (c.warnBeep<=0){ this.audio.warning(); c.warnBeep=1.3; } } else this.warning=false;
    this.updateCallouts(dtR);
  }
  updateContact(dt){ const c=this.contact; if (c.done&&!c.lost) return;
    if (!c.lost&&!c.done&&this.range<c.at){ c.lost=true; c.t=0; this.attemptInfo.contactLostOccurred=true; this.mission.contactLosses++; this.assistantSay(L('a_lost'),2); this.flash('RADAR CONTACT LOST','','#ff4a3d',1.6); this.radar.blip=null; }
    else if (c.lost){ c.t+=dt; if (c.t>=c.dur){ c.lost=false; c.done=true; this.assistantSay(L('a_regained'),1); } } }
  updateRadioCalls(){
    const c=this.calls, t=this.target, C=GAME_CONFIG; if (t.ai==='ESCAPE') return;
    const k=Math.ceil(this.range/1000);
    if (k<=C.radioCallStartKm&&k>=1&&k<c.km){
      c.km=k; const altFt=Math.round(t.pos.z*3.28084/10)*10, brg=Math.round(this.bearingDeg)%360;
      if (k<=C.inRangeKm&&!c.inRange){
        c.inRange=true; c.inRangeAt=this.clock;
        this.radio.say(L('r_inrange',k,altFt,pad(brg,3)),{priority:2,kind:'shout',shout:true,speech:L('r_inrange',k,altFt,spokenBrg(brg))});
        this.banner={text:L('in_range'),t:this.clock,dur:2.8}; this.assistant.say(L('in_range')+'!'); this.vibrate(80);
        this.readout={km:k,alt:altFt,brg,t:this.clock};
      } else if (!this.contact.lost){
        this.radio.say(L('r_dist',k,altFt,pad(brg,3)),{priority:1,kind:'dist',speech:L('r_dist',k,altFt,spokenBrg(brg))});
        this.readout={km:k,alt:altFt,brg,t:this.clock};
      }
    }
  }
  clockOf(){ const rel=wrap360((this.tAz-this.cam.yaw)*R2D); const c=Math.round(rel/30)%12; return c===0?12:c; }
  assistantSay(txt,prio=1){ this.assistant.say(txt); this.radio.say(txt,{speaker:'assistant',priority:prio,kind:'assist'}); }
  updateCallouts(dt){
    const c=this.calls; if (!c.detected) return; c.nextAssist-=dt; if (c.nextAssist>0) return;
    const t=this.target; if (!t||t.ai==='ESCAPE'){ c.nextAssist=2; return; }
    const rel=wrapPi(this.tAz-this.cam.yaw)*R2D; let txt=null;
    if (!this.targetOnScreen()){
      if (this.tEl>this.cam.pitch+this.cam.vfov/2&&Math.abs(rel)<this.cam.fov*R2D/2) txt=L('a_up');
      else if (Math.abs(rel)>120) txt=L('a_behind'); else txt=rel>0?L('a_right'):L('a_left');
    } else if (!this.lock.locked&&!this.lock.acquiring) txt=this.range<5000?L('a_closing'):L('a_clock',this.clockOf());
    else if (this.lock.locked&&this.intercept.window==='EARLY'&&this.range>GAME_CONFIG.inRangeKm*1000+700) txt=L('a_wait');
    if (txt){ this.assistantSay(txt); c.nextAssist=this.fxRng.range(6.5,9.5); } else c.nextAssist=2;
  }

  onAcquireStart(){ this.audio.click(); }
  onLocked(t){ const m=this.mission; m.successfulLocks++; m.lockTimes.push(t); this.audio.lockConfirm(); this.flash('LOCK CONFIRMED','STEADY LOCK','#7dff9a',1.4); this.assistantSay(L('a_lock'),1); this.unlock('first_lock'); if (t<2&&this.mode!=='training') this.unlock('quick'); }
  onLockLost(){ this.mission.failedLocks++; this.flash('LOCK LOST','','#ff4a3d',1.1); this.audio.error(); }

  /* ---------- atış ---------- */

class Tutorial {
  constructor(g,mode){ this.g=g; this.mode=mode; this.step=0; this.cond=0; this.timer=0; this.active=true; this.done=false; this.relock=false; }
  get total(){ return 8; }
  onNewAttempt(){ if (!this.active) return; if (this.step<6){ this.step=0; this.cond=0; this.timer=0; } }
  next(){ this.step++; this.cond=0; this.timer=0; this.relock=false; this.g.audio.click(); if (this.step>=this.total) this.complete(); }
  complete(){ if (this.done) return; this.active=false; this.done=true; this.g.onTutorialComplete(this.mode); }
  update(dt){
    if (!this.active) return; const g=this.g, S=GAME_STATE, st=g.state;
    switch (this.step){
      case 0: this.timer+=dt; if (ENGAGE.has(st)&&g.targetOnRadar()&&this.timer>2.5) this.next(); break;
      case 1: if (ENGAGE.has(st)&&g.targetOnScreen()){ this.cond+=dt; if (this.cond>1) this.next(); } break;
      case 2: if (g.lock.locked){ this.step=4; this.cond=0; break; } if (ENGAGE.has(st)&&g.targetOnScreen()&&g.lock.err<g.params.tol*2){ this.cond+=dt; if (this.cond>1.2) this.next(); } else this.cond=Math.max(0,this.cond-dt*.5); break;
      case 3: if (g.lock.locked) this.next(); break;
      case 4: if (ENGAGE.has(st)&&!g.lock.locked){ this.step=3; this.relock=true; break; } if (g.intercept.quality>.45){ this.cond+=dt; if (this.cond>.6) this.next(); } if (st===S.LAUNCH||st===S.MISSILE_FLIGHT){ this.step=6; } break;
      case 5: if (st===S.LAUNCH||st===S.MISSILE_FLIGHT) this.next(); else if (ENGAGE.has(st)&&!g.lock.locked){ this.step=3; this.relock=true; } break;
      case 6: if (st===S.HIT||st===S.MISS) this.next(); break;
      case 7: if (st===S.NEXT_ATTEMPT||st===S.MISSION_COMPLETE||st===S.MISSION_FAILED) this.next(); break;
    }
  }
}

function beginNetCapture(game){
  const q=[], saved=[], objs={particles:game.particles,audio:game.audio,radio:game.radio,assistant:game.assistant,game};
  const plain=v=>JSON.parse(JSON.stringify(v===undefined?null:v));
  for (const key of NET_EVENTS){ const [o,m]=key.split('.'), obj=objs[o], orig=obj[m]; if (typeof orig!=='function') continue;
    saved.push([obj,m,Object.prototype.hasOwnProperty.call(obj,m)?orig:undefined]);
    obj[m]=function(...a){ if (q.length<200) { try { q.push([key,plain(a)]); } catch(e){} } return orig.apply(this,a); }; }
  return { flush(){ return q.splice(0,q.length); }, end(){ for (const [obj,m,own] of saved){ if (own) obj[m]=own; else delete obj[m]; } saved.length=0; } };
}

function botPolicy(g,beh,rng){
  const inp=g.input; if (!ENGAGE.has(g.state)){ inp.lockHeld=false; return; }
  const t=g.target, eye=g.eye(), ae=aeOf(V.sub(t.pos,eye)), r=V.len(V.sub(t.pos,eye));
  if (beh==='idle'){ inp.lockHeld=false; return; }
  if (beh==='nolock'){ g.aim.setDirect(ae.az+.35,ae.el); inp.lockHeld=false; return; }
  if (beh==='track'){ g.aim.setDirect(ae.az,ae.el); inp.lockHeld=false; return; }
  if (beh==='jitter'){ g.aim.setDirect(ae.az+(rng.next()-.5)*4*D2R,ae.el+(rng.next()-.5)*4*D2R); if (!inp.lockHeld&&r<8500){ inp.lockHeld=true; inp.lockPressed=true; } return; }
  let az=ae.az, el=ae.el; const ic=g.intercept;
  if (g.lock.locked&&ic.pipDir){
    if (beh==='badtiming'){ az=wrapPi(ae.az-(ic.pipAz-ae.az)); el=ae.el-(ic.pipEl-ae.el); }
    else { az=ic.pipAz; el=ic.pipEl; }
  }
  g.aim.setDirect(az,el);
  if (!g.lock.locked){
    if (!g.lock.acquiring){ if (inp.lockHeld) inp.lockHeld=false; else if (r<8500){ inp.lockHeld=true; inp.lockPressed=true; } }
  } else if (ic.window==='VALID'){
    if (beh==='hit'&&((r<4300&&ic.quality>.7)||r<2200)) inp.firePressed=true;
    if (beh==='badtiming') inp.firePressed=true;
  }
  if (beh==='lockonly') inp.firePressed=false;
}
function makeTestGame(backend){ const st=new StorageManager(backend||new MemoryBackend()); return new Game({headless:true,storage:st,width:1280,height:720}); }
function checkFinite(g){
  const vals=[g.timer.left,g.player.x,g.player.y,g.player.health,g.aim.az,g.aim.el,g.cam.yaw,g.cam.pitch,g.cam.fov];
  if (g.target) vals.push(g.target.pos.x,g.target.pos.y,g.target.pos.z,g.target.vel.x);
  if (g.missile) vals.push(g.missile.pos.x,g.missile.pos.y,g.missile.pos.z);
  if (g.mission) vals.push(g.mission.missilesRemaining,g.mission.hakRemaining,g.mission.scoreSoFar);
  return vals.every(Number.isFinite)&&g.timer.left>=0&&g.player.health>=0&&(!g.mission||g.mission.missilesRemaining>=0);
}
const ATTEMPT_DONE=g=>g.state===GAME_STATE.NEXT_ATTEMPT||g.state===GAME_STATE.MISSION_COMPLETE||g.state===GAME_STATE.MISSION_FAILED;
function runUntil(g,beh,cond,maxT,dt=1/60,rng=new RNG(9)){
  g._seen=g._seen||new Set(); let t=0;
  while (t<maxT){ if (cond(g)) return true; botPolicy(g,beh,rng); g.step(dt); g._seen.add(g.state); if (g.viewCam===g.mCam) g._seen.add('MCAM'); if (!checkFinite(g)) throw new Error('NaN/geçersiz değer, durum='+g.state); t+=dt; }
  return cond(g);
}
const playAttempt=(g,beh,dt)=>runUntil(g,beh,ATTEMPT_DONE,200,dt);
function playMission(g,behs,dt){ let i=0, guard=0; while (guard++<40){ playAttempt(g,typeof behs==='function'?behs(i):behs[Math.min(i,behs.length-1)],dt); i++; if (g.state!==GAME_STATE.NEXT_ATTEMPT) break; g.continueNext(); } return i; }

/* ===================== ONLINE İSTEMCİ ===================== */
const DEFAULT_SERVER = '__STINGER_SERVER__';   // APK derlemesinde GitHub Actions bu değeri sunucu adresiyle değiştirir
const SNAP_HZ = 15;

class OnlineClient {
  constructor(game, ui) {
    this.g = game; this.ui = ui; this.$ = id => document.getElementById(id);
    const d = game.storage.data; d.online = d.online || {}; const o = d.online;
    if (!o.deviceId) o.deviceId = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    if (!o.name) o.name = (LANG === 'en' ? 'Gunner' : 'Atıcı') + Math.floor(1000 + Math.random() * 9000);
    if (o.url === undefined) o.url = '';
    if (!Array.isArray(o.pending)) o.pending = [];
    game.storage.save();
    this.o = o; this.ws = null; this.status = 'off'; this.me = null; this.room = null; this.chat = []; this.retry = 0; this.onlineN = 0;
    this.lb = {}; this.lbSel = { period: 'day', kind: 'solo' }; this.rooms = []; this.turnKey = null; this.cap = null; this.shooting = null; this.snapAcc = 0;
    this.inMatch = false; this.waiting = null; this.wanted = false; this.unread = 0; this.lastOver = null; this.leaveAt = 0; this.cardTimer = null;
    this.bind();
  }
  /* ---------- bağlantı ---------- */
  resolveUrl() {
    let u = (this.o.url || '').trim();
    if (!u && !DEFAULT_SERVER.startsWith('__')) u = DEFAULT_SERVER;
    if (!u && typeof location !== 'undefined' && /^https?:$/.test(location.protocol) && !window.Capacitor && location.host) u = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) u = u.replace(/^http/i, 'ws');
    if (!/^wss?:\/\//i.test(u)) u = 'wss://' + u;
    return u.replace(/\/+$/, '');
  }
  connect() {
    const url = this.resolveUrl(); this.wanted = true;
    if (!url) { this.setStatus('nourl'); return; }
    if (this.ws && (this.ws.readyState === 0 || this.ws.readyState === 1) && this.ws._url === url) return;
    this.close(true);
    let ws; try { ws = new WebSocket(url); } catch (e) { this.setStatus('err'); this.scheduleRetry(); return; }
    ws._url = url; this.ws = ws; this.setStatus('conn');
    ws.onopen = () => { this.retry = 0; this.send('hello', { deviceId: this.o.deviceId, name: this.o.name, ver: GAME_CONFIG.version }); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (er) { return; } try { this.handle(m); } catch (er) { console.error(er); } };
    ws.onclose = () => { if (this.ws !== ws) return; this.ws = null; this.me = null; this.setStatus(this.wanted ? 'err' : 'off'); if (this.shooting) this.stopShooting(); if (this.wanted) this.scheduleRetry(); };
    ws.onerror = () => {};
  }
  scheduleRetry() { clearTimeout(this.retryT); const ms = Math.min(20000, 1500 * Math.pow(1.7, this.retry++)); this.retryT = setTimeout(() => { if (this.wanted && !this.ws) this.connect(); }, ms); }
  close(keepWanted) { if (!keepWanted) this.wanted = false; clearTimeout(this.retryT); if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch (e) {} } }
  get connected() { return !!(this.ws && this.ws.readyState === 1 && this.me); }
  send(t, d = {}) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify({ t, ...d })); return true; } return false; }
  setStatus(s) { this.status = s; this.renderStatus(); }
  need() { if (this.connected) return true; this.ui.toast('ONLINE', L('on_need')); if (!this.ws) this.connect(); return false; }

  /* ---------- gelen mesajlar ---------- */
  handle(m) {
    switch (m.t) {
      case 'welcome': this.me = { id: m.id, name: m.name }; this.o.name = m.name; this.g.storage.save(); this.onlineN = m.online || 0; this.setStatus('on'); this.flushScores(); this.send('rooms'); if (this.ui.current === 'scr-lb') this.requestLb(); break;
      case 'pong': this.onlineN = m.online || this.onlineN; this.renderStatus(); break;
      case 'err': this.ui.toast('ONLINE', L('err_' + m.code)); if (m.code !== 'name' && this.waiting) this.closeWait(); break;
      case 'lb': this.lb[m.period + '|' + m.kind] = m; this.renderLb(); break;
      case 'rooms': this.rooms = m.list || []; this.onlineN = m.online || this.onlineN; this.renderRooms(); this.renderStatus(); break;
      case 'room': this.onRoom(m.room, m.chat); break;
      case 'request': this.ui.toast(L('rm_pending'), L('rq_toast', m.name)); this.g.audio.tone(880, .12, 'triangle', .06); this.g.audio.tone(1175, .16, 'triangle', .06, 'sfx', .14); this.g.vibrate(60); break;
      case 'pending': this.openWait('pending', m); break;
      case 'rejected': this.closeWait(); this.room = null; this.ui.toast('ONLINE', L('rej_' + (m.why || 'host'))); this.showHub(); break;
      case 'left': if (m.why === 'kick') this.ui.toast('ONLINE', L('rej_kick')); else if (m.why === 'closed') this.ui.toast('ONLINE', L('rej_closed'));
        if (m.why !== 'self') { this.room = null; this.exitMatch(); this.showHub(); } break;
      case 'quick': if (m.state === 'waiting') this.openWait('quick', m); else this.closeWait(); break;
      case 'chat': this.chat.push(m); if (this.chat.length > 80) this.chat.shift(); this.renderChat(true); break;
      case 'snap': if (this.g.mode === 'spectate' && this.room && this.room.turn && m.i === this.room.turn.idx && m.d) this.g.applySnap(m.d.d, m.d.ev); break;
      case 'over': this.lastOver = m.ranking; this.showOver(m.ranking); break;
      case 'submitted': this.o.pending = this.o.pending.filter(s => s.key !== m.key); this.g.storage.save(); break;
    }
  }
  onRoom(room, chat) {
    this.room = room; if (chat) this.chat = chat.slice();
    if (this.waiting && this.waiting.kind === 'pending' && room.members.some(x => x.id === (this.me && this.me.id) && x.inRoom)) this.closeWait();
    if (this.waiting && this.waiting.kind === 'quick') this.closeWait();
    if (room.phase === 'lobby') { if (this.inMatch) { this.exitMatch(); } this.renderRoom(); if (this.ui.current !== 'scr-room' && !this.g.isPlaying()) this.ui.show('scr-room'); }
    else if (room.phase === 'playing') { if (!this.inMatch) this.enterMatch(); this.renderScores(); this.onTurn(room.turn); }
    else if (room.phase === 'finished') { if (this.inMatch) this.renderScores(); else { this.renderRoom(); } }
    this.renderChat(false);
  }

  /* ---------- sıra yönetimi ---------- */
  onTurn(t) {
    if (!t) return; const key = t.idx + ':' + t.phase; if (key === this.turnKey) return; this.turnKey = key;
    const mine = this.me && t.shooter === this.me.id, rem = Math.max(500, (t.until || 0) - (t.now || Date.now()));
    if (t.phase === 'intro') {
      if (this.shooting) this.stopShooting();
      this.fade(true);
      setTimeout(() => { if (this.turnKey === key) { this.g.startSpectate({ name: t.name, diff: t.diff, round: t.round, of: t.of, shot: t.shotNo, idle: true }); } }, 420);
      this.showIntro(t, mine, rem);
      if (mine) { this.g.audio.tone(660, .14, 'square', .06); this.g.audio.tone(880, .14, 'square', .06, 'sfx', .16); this.g.audio.tone(1320, .3, 'square', .07, 'sfx', .32); this.g.vibrate([80, 60, 160]); }
      else this.g.audio.tone(520, .2, 'triangle', .05);
    } else if (t.phase === 'live') {
      this.hideCard(); this.fade(false);
      const info = { name: t.name, diff: t.diff, round: t.round, of: t.of, shot: t.shotNo };
      if (mine) this.startShooting(t, info); else this.g.startSpectate(info);
    } else if (t.phase === 'result') {
      if (this.shooting && this.shooting.idx === t.idx && !this.shooting.sent) this.stopShooting();
      this.showResult(t, rem);
    }
    this.renderScores();
  }
  startShooting(t, info) {
    this.g.onlineInfo = info;
    this.g.startMission('online', t.diff, { seed: t.seed, tutorial: false });
    this.cap = beginNetCapture(this.g); this.shooting = { idx: t.idx, sent: false }; this.snapAcc = 1;
    this.ui.requestPointer();
  }
  tick(dt) {
    if (this.shooting && !this.shooting.sent && this.cap) {
      this.snapAcc += dt;
      if (this.snapAcc >= 1 / SNAP_HZ) { this.snapAcc = 0; this.send('snap', { d: { d: this.g.makeSnap(), ev: this.cap.flush() } }); }
    }
    this.pingAcc = (this.pingAcc || 0) + dt; if (this.pingAcc > 20 && this.connected) { this.pingAcc = 0; this.send('ping', { ts: Date.now() }); }
  }
  onShotDone(res) {
    if (!this.shooting || this.shooting.sent) return;
    if (this.cap) this.send('snap', { d: { d: this.g.makeSnap(), ev: this.cap.flush() } });
    this.send('result', { ...res, i: this.shooting.idx }); this.shooting.sent = true; this.ui.releasePointer();
    if (this.cap) { this.cap.end(); this.cap = null; }
  }
  stopShooting() {
    if (this.cap) { this.cap.end(); this.cap = null; }
    if (this.shooting) this.ui.releasePointer(); this.shooting = null;
    const g = this.g; if (g.mode === 'online' && g.state !== GAME_STATE.MISSION_COMPLETE) { g.setState(GAME_STATE.MISSION_COMPLETE); g.audio.stopEngine(); g.audio.stopMotor(); g.audio.updateLockTone(0, 'off', 0, 0); g.radio.clear(); }
  }
  enterMatch() {
    this.inMatch = true; this.turnKey = null; document.body.classList.add('mp'); this.ui.hideScreens(); this.layout();
    this.g.startSpectate({ name: '', diff: this.room.diff, idle: true });
  }
  exitMatch() {
    if (!this.inMatch) return; this.stopShooting(); this.ui.releasePointer(); this.inMatch = false; this.turnKey = null; this.hideCard(); this.fade(false);
    document.body.classList.remove('mp', 'mp-dock'); if (this.closeDrawers) this.closeDrawers();
    this.g.goMenu(); this.ui.r.resize();
  }
  layout() { if (!this.inMatch) return; const dock = window.innerWidth >= 1000; document.body.classList.toggle('mp-dock', dock); this.ui.r.resize(); }
  fade(on) { this.$('mpFade').classList.toggle('on', !!on); }

  /* ---------- kartlar (geçişler) ---------- */
  card(cls, html, ms, btns) {
    const c = this.$('mpCard'); clearTimeout(this.cardTimer);
    c.className = ''; void c.offsetWidth; c.className = 'on ' + cls + (btns ? ' btns' : ''); c.innerHTML = html;
    const bar = c.querySelector('.bar i'); if (bar && ms) { bar.style.transition = 'none'; bar.style.width = '100%'; requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${ms}ms linear`; bar.style.width = '0%'; })); }
  }
  hideCard() { const c = this.$('mpCard'); c.className = ''; c.innerHTML = ''; }
  showIntro(t, mine, ms) {

}
