  showReport(r){ this.pendingReport=r; this.promoQueue=r.promos.slice(); if (this.promoQueue.length) this.nextPromo(); else this.renderReport(); }
  nextPromo(){
    const p=this.promoQueue.shift(); if (!p){ this.renderReport(); return; }
    const T=this.$('promoTitle'), A=this.$('promoArt'), X=this.$('promoText');
    if (p.kind==='training_ribbon'){ T.textContent=L('promo_train'); A.innerHTML=ribbonSVG('egitim',1); X.textContent=L('promo_train_t'); }
    else if (p.kind==='superior'){ T.textContent=L('promo_superior'); A.innerHTML=ribbonSVG('ustun',1); X.textContent=L('promo_superior_t');
      if (p.promoted) this.promoQueue.unshift({kind:'promote',from:p.from,to:p.to}); else X.textContent+=' '+L('promo_max'); }
    else { T.textContent=L('promo_promote'); A.innerHTML=rankSVG(p.to); X.textContent=L('promo_promote_t',rankName(p.from),rankName(p.to)); }
    this.g.audio.tone(523,.18,'triangle',.07); this.g.audio.tone(659,.18,'triangle',.07,'sfx',.18); this.g.audio.tone(784,.4,'triangle',.08,'sfx',.36);
    this.show('scr-promo');
  }
  renderReport(){
    const r=this.pendingReport; if (!r) return;
    this.$('repTitle').textContent=r.title; this.$('repTitle').style.color=r.complete||(r.trainInfo&&r.trainInfo.ok)?'var(--green)':'var(--red)';
    this.$('repText').textContent=r.text;
    const keys=r.training?['egitim']:['atis','harekat','lojistik','ustun'], earned=r.training?{egitim:this.g.storage.data.training.ribbon}:r.ribbons;
    this.$('repRibbons').innerHTML=keys.map(k=>`<div class="rib ${earned[k]?'':'off'}">${ribbonSVG(k,1)}🏅 ${esc(L('rib_'+k))}<small>${earned[k]?L('earned'):esc(L('ribd_'+k))}</small></div>`).join('');
    let x='';
    if (r.newHigh) x+=`<p style="color:var(--amber);font-weight:700">${L('rep_highscore')}</p>`;
    if (r.trainInfo){ const TC=GAME_CONFIG.training; x+=`<p>${esc(L('rep_train_note',r.trainInfo.hits,TC.minHitsPerSession,r.trainInfo.successfulSessions,TC.requiredSessions))}</p>`; if (!r.trainInfo.tutorialDone) x+=`<p class="note">${esc(L('rep_train_need_tut'))}</p>`; }
    if (r.dailyInfo) x+=`<p style="color:${r.dailyInfo.ok?'var(--green)':'var(--red)'}">${esc(r.dailyInfo.ok?L('rep_daily_ok'):L('rep_daily_fail'))}</p>`;
    if (r.newAch.length){ const A=ACH_TEXT[LANG]||ACH_TEXT.tr; x+=`<h3>${esc(L('rep_newach'))}</h3><div class="ach">${r.newAch.map(id=>`<div><b>${ACH_ICON[id]||''} ${esc(A[id][0])}</b><span>${esc(A[id][1])}</span></div>`).join('')}</div>`; }
    this.$('repExtra').innerHTML=x; this.show('scr-report'); this.pendingReport=null;
  }
  /* --- menü ekranları --- */
  refreshMenu(){ const d=this.g.storage.data; this.$('mRank').textContent=rankName(d.rank); this.$('mBest').textContent=d.highScore; }
  fillTraining(){
    const tr=this.g.storage.data.training, TC=GAME_CONFIG.training;
    this.$('trainStats').innerHTML=[[L('tr_tut'),tr.tutorialDone?L('yes'):L('no')],[L('tr_sessions'),`${Math.min(tr.successfulSessions,TC.requiredSessions)} / ${TC.requiredSessions}`],[L('tr_total'),tr.sessions],[L('tr_hits'),tr.totalHits],[L('tr_ribbon'),tr.ribbon?L('earned'):L('no')]].map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('');
    this.$('trainRibbon').innerHTML=`<div class="rib ${tr.ribbon?'':'off'}">${ribbonSVG('egitim',1)}${esc(L('rib_egitim'))}<small>${esc(L('ribd_egitim'))}</small></div>`;
  }
  fillDaily(){ const d=dailyFor(todayKey()), done=!!this.g.storage.data.daily[d.key];
    this.$('dailyBody').innerHTML=`<p style="font-size:17px;color:var(--white);margin-bottom:8px">${esc(L('daily_'+d.id))}</p><table class="stats"><tr><td>${L('daily_diff')}</td><td>${L('diff_'+d.diff)}</td></tr><tr><td>${L('daily_wx')}</td><td>${d.weather?L('wx_'+d.weather):'—'}</td></tr><tr><td>${L('daily_today')}</td><td>${String(d.key).replace(/(\d{4})(\d{2})(\d{2})/,'$3.$2.$1')}</td></tr></table><p style="color:${done?'var(--green)':'var(--grey)'}">${done?L('daily_done'):L('daily_open')}</p>`; }
  fillScores(){ const d=this.g.storage.data, p=d.playerStats;
    const rows=[[L('sc_high'),d.highScore],[L('sc_rate'),Math.round(p.bestHitRate*100)+'%'],[L('sc_miss'),p.lowestMiss!=null?p.lowestMiss+' m':'—'],[L('sc_combo'),p.longestCombo],[L('sc_lock'),p.fastestLock!=null?p.fastestLock.toFixed(2)+' s':'—'],[L('sc_missions'),p.totalMissions],[L('sc_hits'),`${p.totalHits} / ${p.totalShots}`],[L('sc_rank'),rankName(d.rank)]];
    this.$('scoreTable').innerHTML=rows.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('');
    this.$('recentList').textContent=d.missions.length?d.missions.map(m=>{ const dt=new Date(m.d); return `${pad(dt.getDate())}.${pad(dt.getMonth()+1)} ${pad(dt.getHours())}:${pad(dt.getMinutes())}  ${(m.mode==='training'?'EĞT':m.daily?'GÜN':m.diff.slice(0,4)).padEnd(5)} ${String(m.score).padStart(4)}  ${m.hits}/${m.shots}  HP ${m.hp}`; }).join('\n'):L('sc_none');
    this.$('bResetStats').textContent=L('sc_reset'); }
  fillBadges(){ const d=this.g.storage.data, b=d.badges;
    this.$('rankBox').innerHTML=`${rankSVG(d.rank)}<div><div class="note">${esc(L('current_rank'))}</div><b>${esc(rankName(d.rank))}</b><div class="note">${esc(L('next_rank'))}</div></div>`;
    const info={atis:L('hits_n',b.atis),harekat:L('times',b.harekat),lojistik:L('times',b.lojistik),ustun:L('times',b.ustun),egitim:b.egitim?L('earned'):L('ribd_egitim')};
    this.$('ribbonGrid').innerHTML=['atis','harekat','lojistik','ustun','egitim'].map(k=>`<div class="rib ${b[k]?'':'off'}">${ribbonSVG(k,k==='atis'?Math.ceil(b.atis/3):b[k])}${esc(L('rib_'+k))}<small>${esc(b[k]?info[k]:L('ribd_'+k))}</small></div>`).join('');
    const A=ACH_TEXT[LANG]||ACH_TEXT.tr;
    this.$('achGrid').innerHTML=ACHIEVEMENTS.map(id=>`<div class="${d.achievements[id]?'':'off'}"><b>${ACH_ICON[id]||''} ${esc(A[id][0])}</b><span>${esc(A[id][1])}</span></div>`).join(''); }
  confirm(btn,key,confirmKey,fn){ const now=Date.now(); if (this.confirmAt[key]&&now-this.confirmAt[key]<3000){ this.confirmAt[key]=0; fn(); } else { this.confirmAt[key]=now; btn.textContent=L(confirmKey); setTimeout(()=>{ if (this.confirmAt[key]===now){ this.confirmAt[key]=0; btn.textContent=L(key); } },3000); } }
  /* --- bağlamalar --- */
  gesture(){ const a=this.g.audio; a.init(); a.setVolumes(this.g.settings); a.resume(); if (this.g.state===GAME_STATE.MENU) a.startMusic(); }
  begin(mode,diff,opt){ this.gesture(); this.g.startMission(mode,diff,opt); this.requestPointer(); }
  bindMenu(){
    const g=this.g, on=(id,fn)=>this.$(id).addEventListener('click',e=>{ this.gesture(); g.audio.click(); fn(e); });
    document.querySelectorAll('#diffSeg button').forEach(b=>b.addEventListener('click',()=>{ this.gesture(); this.diff=b.dataset.d; g.settings.lastDiff=this.diff; g.storage.save(); this.applyLang(); }));
    on('bStart',()=>this.begin('normal',this.diff,{}));
    on('bOnline',()=>{ if (this.online) this.online.showHub(); });
    on('bTraining',()=>{ this.fillTraining(); this.show('scr-training'); });
    on('bTrainGuided',()=>this.begin('training','TRAINING',{guided:true}));
    on('bTrainFree',()=>this.begin('training','TRAINING',{guided:false,tutorial:false}));
    on('bDaily',()=>{ this.fillDaily(); this.show('scr-daily'); });
    on('bDailyStart',()=>{ const d=dailyFor(todayKey()); this.begin('normal',d.diff,{daily:d,seed:d.seed}); });
    on('bHowto',()=>this.show('scr-howto'));
    on('bScores',()=>{ this.fillScores(); this.show('scr-scores'); });
    on('bBadges',()=>{ this.fillBadges(); this.show('scr-badges'); });
    on('bSettings',()=>{ this.loadSettings(); this.show('scr-settings'); });
    on('bAbout',()=>{ this.$('testOut').hidden=true; this.show('scr-about'); });
    document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{ g.audio.click(); this.showMenu(); }));
    on('bResume',()=>g.resume()); on('bRestart',()=>{ g.restart(); this.requestPointer(); }); on('bPauseMenu',()=>g.goMenu());
    on('bNext',()=>{ this.hideScreens(); g.continueNext(); this.requestPointer(); }); on('bNextMenu',()=>g.goMenu());
    on('bAgain',()=>{ g.restart(); this.requestPointer(); }); on('bRepMenu',()=>g.goMenu());
    on('bPromoOk',()=>this.nextPromo());
    on('bResetStats',e=>this.confirm(e.currentTarget,'sc_reset','sc_reset_confirm',()=>{ g.storage.resetStats(); this.fillScores(); this.refreshMenu(); }));
    on('bSelfTest',()=>{ const o=this.$('testOut'); o.hidden=false; o.textContent=L('tests_running'); setTimeout(()=>{ const t0=performance.now(); let txt; try { txt=formatTestResults(runSelfTests()); } catch(e){ txt='HATA: '+e.message; } o.textContent=txt+`\n(${((performance.now()-t0)/1000).toFixed(1)} s)`; },40); });
  }
  loadSettings(){ const s=this.g.settings; this.$('sMaster').value=s.master; this.$('sMusic').value=s.music; this.$('sRadio').value=s.radio; this.$('sSfx').value=s.sfx; this.$('sSens').value=Math.round(s.sensitivity*100); this.$('sQuality').value=s.quality; this.$('sLang').value=s.lang; this.$('sVoice').classList.toggle('on',!!s.voice); this.$('sVib').classList.toggle('on',!!s.vibration); this.$('sInvert').classList.toggle('on',!!s.invertY); this.$('bResetAll').textContent=L('set_reset'); }
  bindSettings(){
    const g=this.g, s=g.settings, save=()=>{ g.storage.save(); g.audio.setVolumes(s); };
    for (const [id,k] of [['sMaster','master'],['sMusic','music'],['sRadio','radio'],['sSfx','sfx']]) this.$(id).addEventListener('input',e=>{ s[k]=+e.target.value; save(); });
    this.$('sSfx').addEventListener('change',()=>g.audio.lockConfirm()); this.$('sRadio').addEventListener('change',()=>g.audio.radioStatic(false));
    this.$('sSens').addEventListener('input',e=>{ s.sensitivity=+e.target.value/100; save(); });
    this.$('sQuality').addEventListener('change',e=>{ s.quality=e.target.value; save(); this.r.resize(); });
    this.$('sLang').addEventListener('change',e=>{ s.lang=e.target.value; LANG=s.lang; save(); this.applyLang(); this.refreshMenu(); this.loadSettings(); });
    const tog=(id,k)=>{ const el=this.$(id), f=()=>{ s[k]=!s[k]; el.classList.toggle('on',s[k]); save(); if (k==='vibration'&&s[k]) g.vibrate(60); if (k==='voice'&&!s[k]) g.radio.cancelSpeech(); }; el.addEventListener('click',f); el.addEventListener('keydown',e=>{ if (e.key===' '||e.key==='Enter'){ e.preventDefault(); f(); } }); };
    tog('sVoice','voice'); tog('sVib','vibration'); tog('sInvert','invertY');
    this.$('bResetAll').addEventListener('click',e=>this.confirm(e.currentTarget,'set_reset','set_reset_confirm',()=>{ g.storage.resetAll(); this.refreshMenu(); this.loadSettings(); }));
  }
  /* --- her kare --- */
  update(){
    const g=this.g, playing=g.isPlaying()&&!g.paused&&g.state!==GAME_STATE.NEXT_ATTEMPT;
    document.body.classList.toggle('playing',playing);
    const tb=this.$('tutBox'), tu=g.tutorial;
    if (tu&&tu.active&&playing&&g.state!==GAME_STATE.BRIEFING&&g.state!==GAME_STATE.COUNTDOWN){
      tb.classList.add('on'); tb.classList.toggle('compact',tu.mode==='hints'||document.body.classList.contains('touch'));
      const touch=document.body.classList.contains('touch'), key=tu.step+'|'+tu.relock+'|'+LANG+'|'+touch;
      if (this._tk!==key){ this._tk=key; const T=L('tut'), X=L('tut_tx');
        tb.querySelector('.st').textContent=L('tut_step',tu.step+1,tu.total); tb.querySelector('.tt').textContent=T[tu.step]||''; const XT=L('tut_tx_touch'); tb.querySelector('.tx').textContent=(tu.relock&&tu.step===3)?L('tut_relock'):((touch&&XT[tu.step])||X[tu.step]||'');
        tb.querySelector('.dots').innerHTML=Array.from({length:tu.total},(_,i)=>`<i class="${i<=tu.step?'on':''}"></i>`).join(''); }
    } else { tb.classList.remove('on'); this._tk=null; }
    if (document.body.classList.contains('touch')){ const W=this.r.W, H=this.r.H, fk=W+'x'+H; if (fk!==this._fk){ this._fk=fk;
        const al=assistantLayout(W,H), fx=Math.max(14+86+18+46,al.bx+105*al.k), fy=clamp(al.by-130*al.k,120,H-60), f=this.$('btnFire'); f.style.left=Math.round(fx-46)+'px'; f.style.top=Math.round(fy-46)+'px'; } }
    this.$('btnLock').classList.toggle('on',g.input.lockHeld); this.$('btnFire').classList.toggle('on',g.lock.locked&&g.intercept.window==='VALID');
  }
}

/* ===================== GİRİŞ (mouse, klavye, dokunmatik) ===================== */
class InputController {
  constructor(game,ui,canvas){
    this.g=game; this.ui=ui; this.cv=canvas; this.aimTouch=null; this.joyTouch=null; this.lastAutoPause=0; this.mx=-1; this.my=-1;
    const I=game.input, inGame=()=>game.isPlaying()&&!game.paused&&ui.current===null;
    canvas.addEventListener('contextmenu',e=>e.preventDefault()); document.addEventListener('contextmenu',e=>{ if (inGame()) e.preventDefault(); });
    canvas.addEventListener('mousedown',e=>{ ui.gesture(); if (!inGame()) return; e.preventDefault();
      if (e.button===0){ I.lockHeld=true; I.lockPressed=true; ui.requestPointer(); } else if (e.button===2) I.firePressed=true; });
    window.addEventListener('mouseup',e=>{ if (e.button===0) I.lockHeld=false; });
    window.addEventListener('mousemove',e=>{ if (!inGame()) { I.edgeTurn=0; this.mx=e.clientX; this.my=e.clientY; return; }
      if (e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents) return;
      let dx, dy;
      if (document.pointerLockElement){ dx=fin(e.movementX); dy=fin(e.movementY); }
      else { dx=this.mx<0?0:e.clientX-this.mx; dy=this.my<0?0:e.clientY-this.my; } // kilit yokken konum farkı (movementX güvenilmez)
      if (Math.abs(dx)<400&&Math.abs(dy)<400){ I.aimDX+=dx; I.aimDY+=dy; }
      this.mx=e.clientX; this.my=e.clientY;
      if (!document.pointerLockElement){ const W=window.innerWidth, m=W*.04; I.edgeTurn=e.clientX<m?-1:(e.clientX>W-m?1:0); } else I.edgeTurn=0; });
    document.addEventListener('mouseleave',()=>{ I.edgeTurn=0; });
    document.addEventListener('pointerlockchange',()=>{ this.mx=-1; this.my=-1; if (!document.pointerLockElement&&inGame()&&performance.now()-(ui.intentionalUnlock||0)>400){ this.lastAutoPause=performance.now(); game.pause(); } });
    window.addEventListener('keydown',e=>{
      const tg=e.target, typing=tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);
      if (typing){ if (e.key==='Escape') tg.blur(); return; }
      if (e.key==='Enter'&&ui.online&&ui.online.inMatch&&ui.current===null){ e.preventDefault(); ui.releasePointer(); const ci=document.getElementById('mpChatIn'); if (!document.body.classList.contains('mp-dock')) document.getElementById('mpRight').classList.add('open'); ci.focus(); return; }
      const k=e.code; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k)&&ui.current===null) e.preventDefault();
      if (k==='Escape'){ if (game.paused){ if (performance.now()-this.lastAutoPause>350) game.resume(); }
        else if (inGame()) game.pause(); else if (['scr-training','scr-daily','scr-howto','scr-scores','scr-badges','scr-settings','scr-about'].includes(ui.current)) ui.showMenu(); return; }
      if (k==='Enter'){ if (ui.current==='scr-menu'&&!/BUTTON|SELECT|INPUT/.test((document.activeElement||{}).tagName||'')){ ui.begin('normal',ui.diff,{}); e.preventDefault(); } else if (ui.current==='scr-next'&&document.activeElement===document.body){ ui.$('bNext').click(); e.preventDefault(); } return; }
      if (!inGame()) return; ui.gesture(); if (e.repeat) return;
      I.keys[k]=true;
      if (k==='Space'||k==='KeyF') I.firePressed=true; else if (k==='KeyL'){ I.lockHeld=true; I.lockPressed=true; } else if (k==='KeyR') game.toggleRadar(); else if (k==='KeyM') game.toggleMute(); else if (k==='KeyP') game.pause();
    });
    window.addEventListener('keyup',e=>{ if (e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; I.keys[e.code]=false; if (e.code==='KeyL') I.lockHeld=false; });
    window.addEventListener('blur',()=>{ I.clear(); if (inGame()) game.pause(); });
    document.addEventListener('visibilitychange',()=>{ if (document.hidden&&inGame()) game.pause(); });
    // --- dokunmatik ---
    const markTouch=()=>{ if (!document.body.classList.contains('touch')){ document.body.classList.add('touch'); ui.releasePointer(); } };
    if (window.matchMedia&&window.matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
    window.addEventListener('touchstart',()=>{ markTouch(); ui.gesture(); },{passive:true,capture:true});
    const TS=1.35;
    canvas.addEventListener('touchstart',e=>{ if (!inGame()) return; e.preventDefault(); if (this.aimTouch===null){ const t=e.changedTouches[0]; this.aimTouch={id:t.identifier,x:t.clientX,y:t.clientY}; } },{passive:false});
    canvas.addEventListener('touchmove',e=>{ if (!inGame()) return; e.preventDefault(); for (const t of e.changedTouches) if (this.aimTouch&&t.identifier===this.aimTouch.id){ I.aimDX+=(t.clientX-this.aimTouch.x)*TS; I.aimDY+=(t.clientY-this.aimTouch.y)*TS; this.aimTouch.x=t.clientX; this.aimTouch.y=t.clientY; } },{passive:false});
    const endAim=e=>{ for (const t of e.changedTouches) if (this.aimTouch&&t.identifier===this.aimTouch.id) this.aimTouch=null; };
    canvas.addEventListener('touchend',endAim); canvas.addEventListener('touchcancel',endAim);
    const joy=document.getElementById('joy'), knob=document.getElementById('joyKnob');
    const joyMove=t=>{ const r=joy.getBoundingClientRect(), R=r.width/2; let dx=t.clientX-(r.left+R), dy=t.clientY-(r.top+R); const d=Math.hypot(dx,dy), mx=R*.72; if (d>mx){ dx*=mx/d; dy*=mx/d; } knob.style.transform=`translate(${dx}px,${dy}px)`; I.joyX=clamp(dx/mx,-1,1); I.joyY=clamp(-dy/mx,-1,1); };
    joy.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); const t=e.changedTouches[0]; this.joyTouch=t.identifier; joyMove(t); },{passive:false});
    joy.addEventListener('touchmove',e=>{ e.preventDefault(); for (const t of e.changedTouches) if (t.identifier===this.joyTouch) joyMove(t); },{passive:false});
    const joyEnd=e=>{ for (const t of e.changedTouches) if (t.identifier===this.joyTouch){ this.joyTouch=null; I.joyX=0; I.joyY=0; knob.style.transform=''; } };
    joy.addEventListener('touchend',joyEnd); joy.addEventListener('touchcancel',joyEnd);
    const btn=(id,down,up)=>{ const el=document.getElementById(id); el.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); down(); },{passive:false}); el.addEventListener('touchend',e=>{ e.preventDefault(); if (up) up(); },{passive:false}); el.addEventListener('touchcancel',()=>{ if (up) up(); }); el.addEventListener('click',e=>{ e.preventDefault(); }); };
    btn('btnLock',()=>{ I.lockHeld=true; I.lockPressed=true; game.vibrate(15); },()=>{ I.lockHeld=false; });
    btn('btnFire',()=>{ I.firePressed=true; });
    btn('btnPause',()=>game.pause()); btn('btnRadarT',()=>game.toggleRadar());
  }
}

/* ===================== BAŞLAT ===================== */
(function boot(){
  const canvas=document.getElementById('cv');
  const storage=new StorageManager(safeLocalStorage());
  LANG=storage.data.settings.lang||'tr';
  const audio=new AudioManager(true);
  const game=new Game({storage,audio,width:window.innerWidth,height:window.innerHeight});
  const renderer=new Renderer(game,canvas);
  const ui=new UIManager(game,renderer,canvas); game.ui=ui;
  const online=new OnlineClient(game,ui); ui.online=online; ui.applyLang(); if (online.resolveUrl()) online.connect(); else online.setStatus('nourl');
  const Cap=window.Capacitor&&window.Capacitor.Plugins;
  if (Cap){ try { if (Cap.StatusBar) Cap.StatusBar.hide().catch(()=>{}); } catch(e){}
    try { if (Cap.App) Cap.App.addListener('backButton',()=>{
      if (online.inMatch){ online.closeDrawers(); return; }
      if (game.isPlaying()){ game.togglePause(); return; }
      if (ui.current&&ui.current!=='scr-menu'){ if (['scr-room','scr-wait'].includes(ui.current)) return; if (ui.current==='scr-lb') online.showHub(); else ui.showMenu(); return; }
      Cap.App.exitApp(); }); } catch(e){} }
  new InputController(game,ui,canvas);
  audio.setVolumes(storage.data.settings);
  window.addEventListener('resize',()=>renderer.resize());
  window.addEventListener('orientationchange',()=>setTimeout(()=>renderer.resize(),200));
  let last=performance.now(), fpsAcc=0, fpsN=0, lowQ=false;
  function frame(now){
    const dt=Math.min(.1,Math.max(0,(now-last)/1000)); last=now;
    try { game.step(dt); online.tick(dt); renderer.render(); ui.update(dt); }
    catch(err){ console.error(err); if (game.isPlaying()){ try { game.goMenu(); ui.toast('ERROR',String(err.message||err)); } catch(e){} } }
    fpsAcc+=dt; fpsN++; if (fpsAcc>4){ const fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; if (fps<32&&!lowQ&&game.settings.quality!=='low'){ lowQ=true; game.settings.quality=game.settings.quality==='high'?'medium':'low'; renderer.resize(); } }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.STINGER={game,ui,renderer,online,runSelfTests,GAME_CONFIG};
})();
